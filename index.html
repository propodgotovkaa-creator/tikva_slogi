<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тыквенный тир</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #10152d;
}

button {
    font: inherit;
}

/* =========================================================
   ОБЩАЯ СЦЕНА
========================================================= */

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        url("fon.png")
        center center / cover
        no-repeat;
}

/* =========================================================
   МЕНЮ
========================================================= */

#setupScreen {
    position: absolute;
    inset: 0;
    z-index: 3000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 22px;

    background: rgba(7, 10, 34, .43);
    backdrop-filter: blur(5px);
}

.setup-card {
    width: min(930px, 94vw);
    max-height: 94vh;
    overflow-y: auto;

    padding: 30px 34px 32px;

    border-radius: 30px;
    border: 1px solid rgba(255,255,255,.26);

    background:
        linear-gradient(
            145deg,
            rgba(38,32,78,.95),
            rgba(21,27,68,.93)
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.18);

    color: white;
}

.setup-title {
    text-align: center;
    font-size: clamp(29px, 3.3vw, 48px);
    font-weight: 900;
    color: #fff2c2;
    margin-bottom: 8px;
}

.setup-subtitle {
    text-align: center;
    font-size: clamp(14px, 1.4vw, 19px);
    line-height: 1.4;
    opacity: .9;
    margin-bottom: 20px;
}

.counter-wrap {
    text-align: center;
}

.counter {
    display: inline-flex;
    padding: 9px 16px;
    margin-bottom: 23px;

    border-radius: 999px;

    background: rgba(255,255,255,.11);
    border: 1px solid rgba(255,255,255,.17);

    font-size: 17px;
    font-weight: 800;
}

.section {
    margin-bottom: 23px;
}

.section-title {
    margin-bottom: 11px;
    color: #ffd87b;
    font-size: 20px;
    font-weight: 900;
}

.letters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.letter-btn {
    width: 53px;
    height: 53px;

    border-radius: 15px;
    border: 2px solid rgba(255,255,255,.20);

    background: rgba(255,255,255,.10);
    color: white;

    font-size: 23px;
    font-weight: 900;

    cursor: pointer;
    transition: .15s ease;
}

.letter-btn:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.17);
}

.letter-btn.selected {
    color: #37235d;

    background:
        linear-gradient(
            145deg,
            #ffe76f,
            #ffb941
        );

    border-color: #fff2a9;

    box-shadow:
        0 6px 18px rgba(255,185,65,.34);

    transform: translateY(-2px);
}

.syllable-types {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.type-btn {
    min-height: 80px;
    padding: 12px;

    border-radius: 18px;
    border: 2px solid rgba(255,255,255,.18);

    background: rgba(255,255,255,.09);
    color: white;

    cursor: pointer;
}

.type-btn strong {
    display: block;
    font-size: 18px;
    margin-bottom: 5px;
}

.type-btn span {
    font-size: 14px;
    opacity: .78;
}

.type-btn.selected {
    background:
        linear-gradient(
            145deg,
            rgba(114,219,255,.95),
            rgba(91,139,255,.95)
        );

    border-color: #c8f4ff;

    box-shadow:
        0 7px 22px rgba(77,160,255,.35);
}

#error {
    min-height: 24px;
    margin-top: 12px;

    text-align: center;
    color: #ffd0cf;
    font-weight: 700;
}

.start-btn {
    display: block;

    width: min(350px, 100%);
    min-height: 61px;

    margin: 6px auto 0;

    border: 0;
    border-radius: 20px;

    background:
        linear-gradient(
            180deg,
            #ffdd65,
            #ff9e30
        );

    color: #4a2756;

    font-size: 22px;
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 10px 28px rgba(255,151,38,.32);
}

/* =========================================================
   ИГРОВОЙ ЭКРАН
========================================================= */

#playScreen {
    position: absolute;
    inset: 0;

    display: none;
    overflow: hidden;
}

#playScreen.active {
    display: block;
}

#playScreen.aiming {
    cursor: none;
}

#playScreen.reward-mode {
    cursor: default;
}

/* =========================================================
   НАСТРОЙКИ
========================================================= */

#settingsBtn {
    position: absolute;

    top: 22px;
    right: 22px;

    z-index: 2500;

    width: 54px;
    height: 54px;

    border: 1px solid rgba(255,255,255,.30);
    border-radius: 17px;

    background: rgba(24,25,65,.72);
    color: white;

    font-size: 25px;
    cursor: pointer;
}

/* =========================================================
   ПОЛЕ
========================================================= */

#pumpkinField {
    position: absolute;
    inset: 0;
    z-index: 100;
}

/* =========================================================
   ПОЗИЦИЯ ТЫКВЫ
========================================================= */

.pumpkin-slot {
    position: absolute;

    width: clamp(165px, 17vw, 290px);
    aspect-ratio: 1.36;

    transform:
        translate(-50%, -50%)
        scale(var(--pumpkin-scale, 1));

    transform-origin: center;

    cursor: inherit;
}

/* =========================================================
   ЦЕЛАЯ ТЫКВА
========================================================= */

.whole-pumpkin {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 30;

    filter:
        drop-shadow(
            0 13px 10px rgba(0,0,0,.25)
        );

    transition:
        opacity .08s linear,
        transform .15s ease,
        filter .15s ease;
}

.pumpkin-slot.targeted
.whole-pumpkin {
    transform: scale(1.035);

    filter:
        brightness(1.08)
        drop-shadow(
            0 13px 11px rgba(0,0,0,.28)
        );
}

/* =========================================================
   СЛОГ
========================================================= */

.syllable {
    position: absolute;

    left: 50%;
    top: 56%;

    transform: translate(-50%, -50%);

    z-index: 40;

    font-size: clamp(30px, 3.7vw, 57px);
    line-height: 1;
    font-weight: 1000;

    color: #fff8db;

    text-shadow:
        0 3px 0 #8c3e12,
        0 5px 10px rgba(0,0,0,.45);

    pointer-events: none;
}

/* =========================================================
   КОНФЕТЫ ВНУТРИ ТЫКВЫ
========================================================= */

.candy-inside {
    position: absolute;

    left: 50%;
    top: 55%;

    width: 40%;

    transform:
        translate(-50%, -50%)
        scale(.9);

    opacity: 0;

    /*
       ВАЖНО:
       конфеты находятся под половинками,
       но выше фона.
    */
    z-index: 21;

    pointer-events: none;

    filter:
        drop-shadow(
            0 6px 7px rgba(0,0,0,.24)
        );
}

/*
   В момент открытия конфеты
   уже находятся внутри.
*/

.pumpkin-slot.opened.has-candy
.candy-inside {
    opacity: 1;
}

/*
   Когда начинается полёт,
   оригинал внутри скрываем.
*/

.pumpkin-slot.candy-flying
.candy-inside {
    opacity: 0;
}

/* =========================================================
   ПОЛОВИНКИ
========================================================= */

.half {
    position: absolute;

    top: 0;

    width: 54%;
    height: 100%;

    object-fit: contain;

    opacity: 0;

    z-index: 25;

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 9px rgba(0,0,0,.25)
        );
}

.left-half {
    left: 23%;
}

.right-half {
    right: 23%;
}

/*
   Цельная тыква исчезает.
*/

.pumpkin-slot.opened
.whole-pumpkin,

.pumpkin-slot.opened
.syllable {
    opacity: 0;
}

/*
   Половинки сразу начинают
   расходиться.
*/

.pumpkin-slot.opened
.left-half {
    animation:
        openLeft .72s
        cubic-bezier(.18,.78,.24,1)
        forwards;
}

.pumpkin-slot.opened
.right-half {
    animation:
        openRight .72s
        cubic-bezier(.18,.78,.24,1)
        forwards;
}

@keyframes openLeft {

    0% {
        opacity: 1;

        transform:
            translateX(0)
            rotate(0deg);
    }

    100% {
        opacity: 1;

        transform:
            translateX(-58%)
            rotate(-11deg);
    }
}

@keyframes openRight {

    0% {
        opacity: 1;

        transform:
            translateX(0)
            rotate(0deg);
    }

    100% {
        opacity: 1;

        transform:
            translateX(58%)
            rotate(11deg);
    }
}

/* =========================================================
   ПИСТОЛЕТ
========================================================= */

#gunWrap {
    position: absolute;

    left: 50%;

    /*
       Теперь низ картинки не выходит
       за пределы экрана.
    */
    bottom: 1.5%;

    width:
        clamp(150px, 14vw, 235px);

    height:
        clamp(245px, 31vh, 380px);

    transform:
        translateX(-50%)
        rotate(0deg);

    transform-origin:
        50% 92%;

    z-index: 450;

    pointer-events: none;
}

#gun {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center bottom;

    filter:
        drop-shadow(
            0 10px 14px rgba(0,0,0,.32)
        );
}

#gunWrap.recoil #gun {
    animation:
        recoil .17s ease-out;
}

@keyframes recoil {

    0% {
        transform: translateY(0);
    }

    40% {
        transform: translateY(7px);
    }

    100% {
        transform: translateY(0);
    }
}

/* =========================================================
   ПРИЦЕЛ
========================================================= */

#crosshair {
    position: absolute;

    left: 50%;
    top: 45%;

    width: 48px;
    height: 48px;

    transform:
        translate(-50%, -50%);

    z-index: 1200;

    pointer-events: none;

    border:
        3px solid rgba(126,239,255,.95);

    border-radius: 50%;

    box-shadow:
        0 0 9px #65eaff,
        inset 0 0 8px rgba(90,230,255,.5);
}

#crosshair::before,
#crosshair::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    background: #c8fbff;

    box-shadow:
        0 0 7px #6defff;
}

#crosshair::before {
    width: 62px;
    height: 2px;
}

#crosshair::after {
    width: 2px;
    height: 62px;
}

.crosshair-dot {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 7px;
    height: 7px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 9px #65eaff;
}

#crosshair.on-target {
    border-color: #ffe36c;

    box-shadow:
        0 0 14px #ffd75e,
        inset 0 0 10px rgba(255,221,82,.65);
}

#playScreen.reward-mode
#crosshair {
    display: none;
}

/* =========================================================
   ЛАЗЕР
========================================================= */

#laser {
    position: absolute;

    height: 5px;

    border-radius: 999px;

    transform-origin: 0 50%;

    opacity: 0;

    z-index: 430;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            white,
            #91f8ff 20%,
            #4edbff 65%,
            rgba(69,187,255,.65)
        );

    box-shadow:
        0 0 4px white,
        0 0 9px #73efff,
        0 0 18px rgba(60,190,255,.9);
}

#laser.fire {
    animation:
        laserFire .20s ease-out;
}

@keyframes laserFire {

    0% {
        opacity: 0;
    }

    8% {
        opacity: 1;
    }

    65% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

/* =========================================================
   ВСПЫШКА
========================================================= */

.hit-flash {
    position: absolute;

    width: 68px;
    height: 68px;

    border-radius: 50%;

    transform:
        translate(-50%, -50%)
        scale(.1);

    z-index: 600;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            white 0%,
            #b9f7ff 20%,
            #62dbff 38%,
            rgba(77,163,255,.28) 58%,
            transparent 72%
        );

    animation:
        hitFlash .30s ease-out
        forwards;
}

@keyframes hitFlash {

    from {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(.1);
    }

    to {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(1.7);
    }
}

/* =========================================================
   ЛЕТЯЩИЕ КОНФЕТЫ
========================================================= */

#flyingCandy {
    position: fixed;

    left: 0;
    top: 0;

    width: 1px;

    z-index: 1800;

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%, -50%)
        scale(1);

    filter:
        drop-shadow(
            0 15px 17px rgba(0,0,0,.30)
        );

    will-change:
        left,
        top,
        width,
        transform,
        opacity;
}

/* =========================================================
   КНОПКА
========================================================= */

#collectBtn {
    position: absolute;

    left: 50%;
    top: 72%;

    transform:
        translate(-50%, 12px)
        scale(.92);

    z-index: 2000;

    min-width: 275px;

    padding: 16px 30px;

    border:
        2px solid rgba(255,255,255,.7);

    border-radius: 22px;

    background:
        linear-gradient(
            180deg,
            #ffe46e,
            #ff9f32
        );

    color: #542c57;

    font-size:
        clamp(20px, 2.1vw, 29px);

    font-weight: 900;

    box-shadow:
        0 12px 30px rgba(0,0,0,.30),
        inset 0 2px 0 rgba(255,255,255,.65);

    opacity: 0;
    visibility: hidden;

    cursor: pointer;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

#collectBtn.show {
    opacity: 1;
    visibility: visible;

    transform:
        translate(-50%, 0)
        scale(1);
}

#collectBtn:hover {
    transform:
        translate(-50%, 0)
        scale(1.04);
}

/* =========================================================
   АДАПТАЦИЯ
========================================================= */

@media(max-width:720px) {

    .setup-card {
        padding: 22px 18px;
    }

    .letter-btn {
        width: 45px;
        height: 45px;
        font-size: 20px;
    }

    .syllable-types {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- НАСТРОЙКА -->

    <div id="setupScreen">

        <div class="setup-card">

            <div class="setup-title">
                Тыквенный тир
            </div>

            <div class="setup-subtitle">
                Выбери буквы для слогов.
                Всего можно выбрать до 8 букв.
            </div>

            <div class="counter-wrap">
                <div class="counter">
                    Выбрано:
                    <span id="selectedCount">
                        &nbsp;0 / 8
                    </span>
                </div>
            </div>

            <div class="section">

                <div class="section-title">
                    Согласные
                </div>

                <div
                    class="letters"
                    id="consonants">
                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    Гласные
                </div>

                <div
                    class="letters"
                    id="vowels">
                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    Тип слогов
                </div>

                <div class="syllable-types">

                    <button
                        class="type-btn selected"
                        data-type="open">

                        <strong>
                            Открытые
                        </strong>

                        <span>
                            СА · МО · ЛУ
                        </span>

                    </button>

                    <button
                        class="type-btn"
                        data-type="closed">

                        <strong>
                            Закрытые
                        </strong>

                        <span>
                            АС · ОМ · УЛ
                        </span>

                    </button>

                    <button
                        class="type-btn"
                        data-type="mixed">

                        <strong>
                            Смешанные
                        </strong>

                        <span>
                            СА · АС · МО · ОМ
                        </span>

                    </button>

                </div>

            </div>

            <div id="error"></div>

            <button
                class="start-btn"
                id="startBtn">

                Начать игру

            </button>

        </div>

    </div>

    <!-- ИГРА -->

    <div id="playScreen">

        <button id="settingsBtn">
            ⚙
        </button>

        <div id="pumpkinField"></div>

        <div id="laser"></div>

        <div id="gunWrap">

            <img
                id="gun"
                src="pistolet.png"
                draggable="false"
                alt="">

        </div>

        <div id="crosshair">
            <div class="crosshair-dot"></div>
        </div>

        <img
            id="flyingCandy"
            src="konfet.png"
            draggable="false"
            alt="">

        <button id="collectBtn">
            Забрать конфеты
        </button>

    </div>

</div>

<script>

/* =========================================================
   НАСТРОЙКИ
========================================================= */

const MAX_LETTERS = 8;

const consonantLetters = [
    "М","Н","П","Б","Т","Д",
    "К","Г","Х","Ф","В",
    "С","З","Ц",
    "Ш","Ж","Ч","Щ",
    "Л","Р"
];

const vowelLetters = [
    "А","О","У","Ы","Э",
    "И","Е","Ё","Ю","Я"
];

const PUMPKIN_POSITIONS = [

    {
        x: 19,
        y: 57,
        scale: .88
    },

    {
        x: 40,
        y: 49,
        scale: .82
    },

    {
        x: 63,
        y: 50,
        scale: .84
    },

    {
        x: 84,
        y: 58,
        scale: .90
    }

];

/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let selectedConsonants =
    new Set();

let selectedVowels =
    new Set();

let syllableType =
    "open";

let syllables = [];

let gameLocked = false;

let candySlotIndex = null;

let gunAngle = 0;

/* =========================================================
   DOM
========================================================= */

const setupScreen =
    document.getElementById(
        "setupScreen"
    );

const playScreen =
    document.getElementById(
        "playScreen"
    );

const consonantsBox =
    document.getElementById(
        "consonants"
    );

const vowelsBox =
    document.getElementById(
        "vowels"
    );

const selectedCount =
    document.getElementById(
        "selectedCount"
    );

const errorBox =
    document.getElementById(
        "error"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

const settingsBtn =
    document.getElementById(
        "settingsBtn"
    );

const pumpkinField =
    document.getElementById(
        "pumpkinField"
    );

const gunWrap =
    document.getElementById(
        "gunWrap"
    );

const crosshair =
    document.getElementById(
        "crosshair"
    );

const laser =
    document.getElementById(
        "laser"
    );

const flyingCandy =
    document.getElementById(
        "flyingCandy"
    );

const collectBtn =
    document.getElementById(
        "collectBtn"
    );

/* =========================================================
   БУКВЫ
========================================================= */

function createLetterButtons(
    letters,
    container,
    group
) {

    letters.forEach(letter => {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "letter-btn";

        button.textContent =
            letter;

        button.dataset.letter =
            letter;

        button.dataset.group =
            group;

        button.addEventListener(
            "click",
            () => toggleLetter(button)
        );

        container.appendChild(
            button
        );

    });

}

createLetterButtons(
    consonantLetters,
    consonantsBox,
    "consonant"
);

createLetterButtons(
    vowelLetters,
    vowelsBox,
    "vowel"
);

function toggleLetter(button) {

    errorBox.textContent = "";

    const letter =
        button.dataset.letter;

    const set =
        button.dataset.group ===
        "consonant"

        ? selectedConsonants
        : selectedVowels;

    if (set.has(letter)) {

        set.delete(letter);

        button.classList.remove(
            "selected"
        );

    } else {

        const total =
            selectedConsonants.size +
            selectedVowels.size;

        if (total >= MAX_LETTERS) {

            errorBox.textContent =
                "Можно выбрать максимум 8 букв.";

            return;
        }

        set.add(letter);

        button.classList.add(
            "selected"
        );
    }

    updateCounter();
}

function updateCounter() {

    const total =
        selectedConsonants.size +
        selectedVowels.size;

    selectedCount.textContent =
        ` ${total} / 8`;
}

/* =========================================================
   ТИП СЛОГОВ
========================================================= */

document
.querySelectorAll(".type-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(
                ".type-btn"
            )
            .forEach(btn => {

                btn.classList.remove(
                    "selected"
                );

            });

            button.classList.add(
                "selected"
            );

            syllableType =
                button.dataset.type;

        }
    );

});

/* =========================================================
   СОЗДАНИЕ СЛОГОВ
========================================================= */

function buildSyllables() {

    const result = [];

    const consonants =
        [...selectedConsonants];

    const vowels =
        [...selectedVowels];

    consonants.forEach(c => {

        vowels.forEach(v => {

            if (
                syllableType === "open" ||
                syllableType === "mixed"
            ) {

                result.push(
                    c + v
                );
            }

            if (
                syllableType === "closed" ||
                syllableType === "mixed"
            ) {

                result.push(
                    v + c
                );
            }

        });

    });

    return shuffle(
        [...new Set(result)]
    );
}

function getRandomSyllable() {

    return syllables[
        Math.floor(
            Math.random() *
            syllables.length
        )
    ];
}

/* =========================================================
   СТАРТ
========================================================= */

startBtn.addEventListener(
    "click",
    startGame
);

function startGame() {

    errorBox.textContent = "";

    if (
        selectedConsonants.size === 0
    ) {

        errorBox.textContent =
            "Выбери хотя бы одну согласную.";

        return;
    }

    if (
        selectedVowels.size === 0
    ) {

        errorBox.textContent =
            "Выбери хотя бы одну гласную.";

        return;
    }

    syllables =
        buildSyllables();

    setupScreen.style.display =
        "none";

    playScreen.classList.add(
        "active",
        "aiming"
    );

    playScreen.classList.remove(
        "reward-mode"
    );

    createInitialField();
}

/* =========================================================
   СТРОГО ЧЕТЫРЕ ПОЗИЦИИ
========================================================= */

function createInitialField() {

    pumpkinField.innerHTML = "";

    gameLocked = false;

    /*
       РОВНО ЧЕТЫРЕ.
    */

    for (
        let index = 0;
        index < 4;
        index++
    ) {

        createPumpkinAtSlot(
            index
        );
    }

    hideReward();

    chooseCandySlot();
}

/* =========================================================
   СОЗДАТЬ ТЫКВУ В КОНКРЕТНОМ СЛОТЕ
========================================================= */

function createPumpkinAtSlot(
    slotIndex
) {

    /*
       Если на этой позиции уже
       что-то было, удаляем.
    */

    const old =
        pumpkinField.querySelector(
            `[data-slot="${slotIndex}"]`
        );

    if (old) {
        old.remove();
    }

    const position =
        PUMPKIN_POSITIONS[
            slotIndex
        ];

    const slot =
        document.createElement(
            "div"
        );

    slot.className =
        "pumpkin-slot";

    slot.dataset.slot =
        String(slotIndex);

    slot.dataset.hasCandy =
        "0";

    slot.dataset.opened =
        "0";

    slot.style.left =
        position.x + "%";

    slot.style.top =
        position.y + "%";

    slot.style.setProperty(
        "--pumpkin-scale",
        position.scale
    );

    /* КОНФЕТЫ */

    const candy =
        document.createElement(
            "img"
        );

    candy.src =
        "konfet.png";

    candy.className =
        "candy-inside";

    candy.draggable =
        false;

    /* ЛЕВАЯ ПОЛОВИНКА */

    const left =
        document.createElement(
            "img"
        );

    left.src =
        "pumpkin_left.png";

    left.className =
        "half left-half";

    left.draggable =
        false;

    /* ПРАВАЯ */

    const right =
        document.createElement(
            "img"
        );

    right.src =
        "pumpkin_right.png";

    right.className =
        "half right-half";

    right.draggable =
        false;

    /* ЦЕЛАЯ */

    const whole =
        document.createElement(
            "img"
        );

    whole.src =
        "tikva.png";

    whole.className =
        "whole-pumpkin";

    whole.draggable =
        false;

    /* СЛОГ */

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "syllable";

    text.textContent =
        getRandomSyllable();

    /*
       Порядок важен:
       конфеты находятся внутри,
       половинки поверх них.
    */

    slot.appendChild(
        candy
    );

    slot.appendChild(
        left
    );

    slot.appendChild(
        right
    );

    slot.appendChild(
        whole
    );

    slot.appendChild(
        text
    );

    slot.addEventListener(
        "pointerenter",
        () => {

            if (
                gameLocked ||
                slot.dataset.opened === "1"
            ) {
                return;
            }

            slot.classList.add(
                "targeted"
            );

            crosshair.classList.add(
                "on-target"
            );
        }
    );

    slot.addEventListener(
        "pointerleave",
        () => {

            slot.classList.remove(
                "targeted"
            );

            crosshair.classList.remove(
                "on-target"
            );
        }
    );

    slot.addEventListener(
        "pointerdown",
        event => {

            if (
                gameLocked ||
                slot.dataset.opened === "1"
            ) {
                return;
            }

            event.preventDefault();
            event.stopPropagation();

            shootPumpkin(
                slot,
                event.clientX,
                event.clientY
            );
        }
    );

    pumpkinField.appendChild(
        slot
    );
}

/* =========================================================
   СПРЯТАТЬ КОНФЕТЫ
========================================================= */

function chooseCandySlot() {

    /*
       В начале каждого нового поиска
       ВСЕ 4 тыквы целые.

       Поэтому конфеты могут оказаться
       в любой из четырёх.
    */

    const slots =
        [
            ...document.querySelectorAll(
                ".pumpkin-slot"
            )
        ];

    slots.forEach(slot => {

        slot.dataset.hasCandy =
            "0";

        slot.classList.remove(
            "has-candy"
        );

    });

    candySlotIndex =
        Math.floor(
            Math.random() * 4
        );

    const candyPumpkin =
        pumpkinField.querySelector(
            `[data-slot="${candySlotIndex}"]`
        );

    if (candyPumpkin) {

        candyPumpkin.dataset.hasCandy =
            "1";
    }
}

/* =========================================================
   ВЫСТРЕЛ
========================================================= */

function shootPumpkin(
    slot,
    hitX,
    hitY
) {

    if (gameLocked) {
        return;
    }

    if (
        slot.dataset.opened === "1"
    ) {
        return;
    }

    slot.dataset.opened =
        "1";

    slot.classList.remove(
        "targeted"
    );

    crosshair.classList.remove(
        "on-target"
    );

    /*
       Луч от дула точно
       к месту клика.
    */

    fireLaser(
        hitX,
        hitY
    );

    createFlash(
        hitX,
        hitY
    );

    gunWrap.classList.remove(
        "recoil"
    );

    void gunWrap.offsetWidth;

    gunWrap.classList.add(
        "recoil"
    );

    const foundCandy =
        slot.dataset.hasCandy ===
        "1";

    /*
       ВАЖНО:
       если там конфеты,
       класс has-candy ставится
       ДО открытия.

       Значит конфеты уже лежат
       внутри в момент,
       когда расходятся половинки.
    */

    if (foundCandy) {

        slot.classList.add(
            "has-candy"
        );
    }

    /*
       Открываем тыкву.
    */

    requestAnimationFrame(
        () => {

            slot.classList.add(
                "opened"
            );

        }
    );

    /*
       ПУСТАЯ ТЫКВА.

       Она остаётся разбитой.
       Ничего не заменяем.
    */

    if (!foundCandy) {
        return;
    }

    /*
       Нашли конфеты.
       Блокируем дальнейшую стрельбу.
    */

    gameLocked = true;

    /*
       Не ждём полторы секунды.

       Половинки начали расходиться,
       конфеты уже видно.

       Через небольшую паузу
       они начинают медленно
       вылетать из тыквы.
    */

    setTimeout(
        () => {

            flyCandyFrom(
                slot
            );

        },
        420
    );
}

/* =========================================================
   ПЛАВНЫЙ ВЫЛЕТ КОНФЕТ
========================================================= */

function flyCandyFrom(slot) {

    const insideCandy =
        slot.querySelector(
            ".candy-inside"
        );

    const rect =
        insideCandy
        .getBoundingClientRect();

    const startX =
        rect.left +
        rect.width / 2;

    const startY =
        rect.top +
        rect.height / 2;

    /*
       Получаем реальный размер
       конфет внутри тыквы.
    */

    const startWidth =
        Math.max(
            rect.width,
            55
        );

    /*
       Копия начинается ТОЧНО
       на месте конфет внутри.
    */

    flyingCandy.style.transition =
        "none";

    flyingCandy.style.left =
        startX + "px";

    flyingCandy.style.top =
        startY + "px";

    flyingCandy.style.width =
        startWidth + "px";

    flyingCandy.style.opacity =
        "1";

    flyingCandy.style.transform =
        "translate(-50%, -50%) scale(1)";

    /*
       Сначала копия занимает
       то же место.

       Теперь можно скрыть оригинал.
    */

    requestAnimationFrame(
        () => {

            slot.classList.add(
                "candy-flying"
            );

            requestAnimationFrame(
                () => {

                    /*
                       Медленный,
                       аккуратный полёт.
                    */

                    flyingCandy.style.transition =
                        [
                            "left 1.35s cubic-bezier(.22,.75,.25,1)",
                            "top 1.35s cubic-bezier(.22,.75,.25,1)",
                            "width 1.35s cubic-bezier(.22,.75,.25,1)",
                            "transform 1.35s cubic-bezier(.22,.75,.25,1)"
                        ].join(",");

                    flyingCandy.style.left =
                        "50%";

                    flyingCandy.style.top =
                        "43%";

                    flyingCandy.style.width =
                        "clamp(230px, 24vw, 380px)";

                    flyingCandy.style.transform =
                        "translate(-50%, -50%) scale(1)";

                }
            );

        }
    );

    /*
       Выключаем тир.
       Возвращаем обычную мышку.
    */

    playScreen.classList.remove(
        "aiming"
    );

    playScreen.classList.add(
        "reward-mode"
    );

    /*
       Кнопка только после того,
       как конфеты долетели.
    */

    setTimeout(
        () => {

            collectBtn.classList.add(
                "show"
            );

        },
        1400
    );
}

/* =========================================================
   ЗАБРАТЬ КОНФЕТЫ
========================================================= */

collectBtn.addEventListener(
    "click",
    event => {

        event.preventDefault();
        event.stopPropagation();

        collectBtn.classList.remove(
            "show"
        );

        /*
           Конфеты аккуратно исчезают.
        */

        flyingCandy.style.transition =
            "opacity .28s ease, transform .28s ease";

        flyingCandy.style.opacity =
            "0";

        flyingCandy.style.transform =
            "translate(-50%, -50%) scale(.75)";

        setTimeout(
            () => {

                /*
                   НОВЫЙ РАУНД.

                   Проверяем все 4 позиции.
                */

                for (
                    let index = 0;
                    index < 4;
                    index++
                ) {

                    const pumpkin =
                        pumpkinField
                        .querySelector(
                            `[data-slot="${index}"]`
                        );

                    if (!pumpkin) {
                        continue;
                    }

                    /*
                       Была разбита?

                       Тогда на ЭТОМ ЖЕ
                       месте создаём новую
                       целую тыкву
                       с новым слогом.
                    */

                    if (
                        pumpkin.dataset.opened ===
                        "1"
                    ) {

                        createPumpkinAtSlot(
                            index
                        );
                    }

                    /*
                       Если в неё не стреляли,
                       вообще её не трогаем.

                       Остаётся:
                       - та же тыква
                       - тот же слог
                       - та же позиция
                    */
                }

                /*
                   Теперь снова ровно
                   четыре целые тыквы.

                   Перепрятываем конфеты
                   СРЕДИ ВСЕХ ЧЕТЫРЁХ.

                   Поэтому они могут попасть
                   и в старую тыкву,
                   которую в прошлом раунде
                   не трогали.
                */

                chooseCandySlot();

                hideReward();

                gameLocked =
                    false;

                playScreen.classList.remove(
                    "reward-mode"
                );

                playScreen.classList.add(
                    "aiming"
                );

            },
            300
        );

    }
);

/* =========================================================
   СКРЫТЬ НАГРАДУ
========================================================= */

function hideReward() {

    collectBtn.classList.remove(
        "show"
    );

    flyingCandy.style.transition =
        "none";

    flyingCandy.style.opacity =
        "0";

    flyingCandy.style.width =
        "1px";
}

/* =========================================================
   ДВИЖЕНИЕ ПРИЦЕЛА
========================================================= */

playScreen.addEventListener(
    "pointermove",
    event => {

        if (gameLocked) {
            return;
        }

        crosshair.style.left =
            event.clientX + "px";

        crosshair.style.top =
            event.clientY + "px";

        aimGunAt(
            event.clientX,
            event.clientY
        );
    }
);

/* =========================================================
   ПИСТОЛЕТ СМОТРИТ НА ПРИЦЕЛ
========================================================= */

function aimGunAt(
    targetX,
    targetY
) {

    /*
       Для угла используем
       геометрическую точку,
       вокруг которой вращается
       пистолет.
    */

    const rect =
        gunWrap.getBoundingClientRect();

    const pivotX =
        rect.left +
        rect.width / 2;

    const pivotY =
        rect.top +
        rect.height * .92;

    const dx =
        targetX - pivotX;

    const dy =
        pivotY - targetY;

    let angle =
        Math.atan2(
            dx,
            Math.max(
                dy,
                80
            )
        ) *
        180 /
        Math.PI;

    angle =
        Math.max(
            -34,
            Math.min(
                34,
                angle
            )
        );

    gunAngle =
        angle;

    gunWrap.style.transform =
        `translateX(-50%) rotate(${angle}deg)`;
}

/* =========================================================
   ТОЧКА ДУЛА
========================================================= */

function getMuzzlePoint() {

    /*
       ВАЖНО.

       getBoundingClientRect()
       уже учитывает вращение и поэтому
       нельзя использовать его размеры
       как локальную систему координат.

       Берём исходные размеры элемента.
    */

    const baseWidth =
        gunWrap.offsetWidth;

    const baseHeight =
        gunWrap.offsetHeight;

    /*
       Реальный pivot в координатах
       страницы.
    */

    const wrapRect =
        gunWrap.getBoundingClientRect();

    /*
       Поскольку сам wrap центрирован
       по горизонтали, нижняя центральная
       область является нашей базой.
    */

    const pivotX =
        window.innerWidth / 2;

    const pivotY =
        window.innerHeight -
        window.innerHeight * .015 -
        baseHeight * .08;

    /*
       Точка дула в локальных
       координатах PNG.

       Дуло находится почти по центру
       и примерно в 10% высоты картинки.
    */

    const localMuzzleX =
        baseWidth * .50;

    const localMuzzleY =
        baseHeight * .10;

    /*
       Pivot внутри картинки.
    */

    const localPivotX =
        baseWidth * .50;

    const localPivotY =
        baseHeight * .92;

    const vectorX =
        localMuzzleX -
        localPivotX;

    const vectorY =
        localMuzzleY -
        localPivotY;

    const radians =
        gunAngle *
        Math.PI /
        180;

    /*
       Вращаем вектор дула
       тем же углом, что пистолет.
    */

    const rotatedX =
        vectorX *
        Math.cos(radians) -
        vectorY *
        Math.sin(radians);

    const rotatedY =
        vectorX *
        Math.sin(radians) +
        vectorY *
        Math.cos(radians);

    return {

        x:
            pivotX +
            rotatedX,

        y:
            pivotY +
            rotatedY

    };
}

/* =========================================================
   ЛАЗЕР
========================================================= */

function fireLaser(
    targetX,
    targetY
) {

    const muzzle =
        getMuzzlePoint();

    const dx =
        targetX -
        muzzle.x;

    const dy =
        targetY -
        muzzle.y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const angle =
        Math.atan2(
            dy,
            dx
        ) *
        180 /
        Math.PI;

    laser.style.left =
        muzzle.x + "px";

    laser.style.top =
        muzzle.y + "px";

    laser.style.width =
        distance + "px";

    laser.style.transform =
        `rotate(${angle}deg)`;

    laser.classList.remove(
        "fire"
    );

    void laser.offsetWidth;

    laser.classList.add(
        "fire"
    );
}

/* =========================================================
   ВСПЫШКА ПОПАДАНИЯ
========================================================= */

function createFlash(
    x,
    y
) {

    const flash =
        document.createElement(
            "div"
        );

    flash.className =
        "hit-flash";

    flash.style.left =
        x + "px";

    flash.style.top =
        y + "px";

    playScreen.appendChild(
        flash
    );

    setTimeout(
        () => {

            flash.remove();

        },
        350
    );
}

/* =========================================================
   ВЕРНУТЬСЯ В НАСТРОЙКИ
========================================================= */

settingsBtn.addEventListener(
    "click",
    () => {

        playScreen.classList.remove(
            "active",
            "aiming",
            "reward-mode"
        );

        setupScreen.style.display =
            "flex";

        pumpkinField.innerHTML =
            "";

        hideReward();

        gameLocked =
            false;
    }
);

/* =========================================================
   ПЕРЕМЕШИВАНИЕ
========================================================= */

function shuffle(array) {

    for (
        let i =
            array.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }

    return array;
}
