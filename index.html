<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тыквенный тир</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #10152d;
}

button {
    font: inherit;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: url("fon.png") center center / cover no-repeat;
}

/* =====================================================
   МЕНЮ
===================================================== */

#setupScreen {
    position: absolute;
    inset: 0;
    z-index: 2000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    background: rgba(8,12,35,.42);
    backdrop-filter: blur(4px);
}

.setup-card {
    width: min(940px,94vw);
    max-height: 94vh;
    overflow-y: auto;

    padding: 30px 34px 32px;

    border: 1px solid rgba(255,255,255,.28);
    border-radius: 32px;

    background:
        linear-gradient(
            145deg,
            rgba(38,32,78,.94),
            rgba(22,28,70,.91)
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.18);

    color: white;
}

.setup-title {
    text-align: center;
    font-size: clamp(28px,3.4vw,48px);
    font-weight: 900;
    color: #fff3c6;
    margin-bottom: 8px;
}

.setup-subtitle {
    text-align: center;
    font-size: clamp(14px,1.4vw,19px);
    line-height: 1.4;
    opacity: .88;
    margin-bottom: 22px;
}

.counter-wrap {
    text-align: center;
}

.counter {
    display: inline-flex;

    padding: 9px 16px;
    margin-bottom: 24px;

    border-radius: 999px;

    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.18);

    font-size: 17px;
    font-weight: 800;
}

.section {
    margin-bottom: 24px;
}

.section-title {
    font-size: 20px;
    font-weight: 900;
    color: #ffd87b;
    margin-bottom: 12px;
}

.letters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.letter-btn {
    width: 54px;
    height: 54px;

    border: 2px solid rgba(255,255,255,.20);
    border-radius: 15px;

    background: rgba(255,255,255,.10);
    color: white;

    font-size: 24px;
    font-weight: 900;

    cursor: pointer;
    transition: .15s ease;
}

.letter-btn:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.17);
}

.letter-btn.selected {
    color: #37235d;

    background:
        linear-gradient(
            145deg,
            #ffe76f,
            #ffb941
        );

    border-color: #fff2a9;

    box-shadow:
        0 6px 18px rgba(255,185,65,.34);

    transform: translateY(-2px);
}

.syllable-types {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.type-btn {
    min-height: 82px;
    padding: 12px;

    border: 2px solid rgba(255,255,255,.18);
    border-radius: 18px;

    background: rgba(255,255,255,.09);
    color: white;

    cursor: pointer;
    transition: .18s ease;
}

.type-btn strong {
    display: block;
    font-size: 18px;
    margin-bottom: 5px;
}

.type-btn span {
    font-size: 14px;
    opacity: .78;
}

.type-btn.selected {
    background:
        linear-gradient(
            145deg,
            rgba(114,219,255,.95),
            rgba(91,139,255,.95)
        );

    border-color: #c8f4ff;

    box-shadow:
        0 7px 22px rgba(77,160,255,.35);
}

#error {
    min-height: 24px;
    margin-top: 13px;

    text-align: center;
    color: #ffd0cf;
    font-weight: 700;
}

.start-btn {
    display: block;

    width: min(350px,100%);
    min-height: 62px;

    margin: 7px auto 0;

    border: 0;
    border-radius: 20px;

    background:
        linear-gradient(
            180deg,
            #ffdb62,
            #ff9e2f
        );

    color: #4a2756;

    font-size: 22px;
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 10px 28px rgba(255,151,38,.32);
}

/* =====================================================
   ИГРА
===================================================== */

#playScreen {
    position: absolute;
    inset: 0;
    display: none;
    overflow: hidden;
}

#playScreen.active {
    display: block;
}

#playScreen.aiming {
    cursor: none;
}

#playScreen.reward-mode {
    cursor: default;
}

/* =====================================================
   НАСТРОЙКИ
===================================================== */

#settingsBtn {
    position: absolute;

    top: 22px;
    right: 22px;

    z-index: 1500;

    width: 54px;
    height: 54px;

    border: 1px solid rgba(255,255,255,.30);
    border-radius: 17px;

    background: rgba(24,25,65,.72);
    color: white;

    font-size: 25px;
    cursor: pointer;
}

/* =====================================================
   ТЫКВЫ
===================================================== */

#pumpkinField {
    position: absolute;
    inset: 0;
    z-index: 100;
}

.pumpkin-slot {
    position: absolute;

    width: clamp(165px,17vw,290px);
    aspect-ratio: 1.36;

    transform: translate(-50%,-50%);

    cursor: inherit;
}

.whole-pumpkin {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 30;

    filter:
        drop-shadow(
            0 13px 10px rgba(0,0,0,.25)
        );

    transition:
        opacity .08s linear,
        transform .15s ease,
        filter .15s ease;
}

.pumpkin-slot.targeted .whole-pumpkin {
    transform: scale(1.035);

    filter:
        brightness(1.07)
        drop-shadow(
            0 14px 11px rgba(0,0,0,.28)
        );
}

.syllable {
    position: absolute;

    left: 50%;
    top: 56%;

    transform: translate(-50%,-50%);

    z-index: 40;

    font-size: clamp(30px,3.8vw,58px);
    line-height: 1;
    font-weight: 1000;

    color: #fff8db;

    text-shadow:
        0 3px 0 #8c3e12,
        0 5px 10px rgba(0,0,0,.45);

    pointer-events: none;
}

/* =====================================================
   ПОЛОВИНКИ
===================================================== */

.half {
    position: absolute;

    top: 0;

    width: 54%;
    height: 100%;

    object-fit: contain;

    opacity: 0;

    z-index: 25;

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 9px rgba(0,0,0,.25)
        );
}

.left-half {
    left: 23%;
}

.right-half {
    right: 23%;
}

.pumpkin-slot.opened .whole-pumpkin,
.pumpkin-slot.opened .syllable {
    opacity: 0;
}

.pumpkin-slot.opened .left-half {
    animation:
        openLeft .60s
        cubic-bezier(.22,.85,.28,1.05)
        forwards;
}

.pumpkin-slot.opened .right-half {
    animation:
        openRight .60s
        cubic-bezier(.22,.85,.28,1.05)
        forwards;
}

@keyframes openLeft {
    0% {
        opacity: 1;
        transform:
            translateX(0)
            rotate(0deg);
    }

    100% {
        opacity: 1;
        transform:
            translateX(-54%)
            rotate(-10deg);
    }
}

@keyframes openRight {
    0% {
        opacity: 1;
        transform:
            translateX(0)
            rotate(0deg);
    }

    100% {
        opacity: 1;
        transform:
            translateX(54%)
            rotate(10deg);
    }
}

/* =====================================================
   КОНФЕТЫ ВНУТРИ
===================================================== */

.candy-inside {
    position: absolute;

    left: 50%;
    top: 55%;

    width: 43%;

    transform:
        translate(-50%,-50%)
        scale(.55);

    opacity: 0;

    /*
       Конфеты между задним фоном
       и половинками тыквы.
    */
    z-index: 22;

    pointer-events: none;

    filter:
        drop-shadow(
            0 6px 7px rgba(0,0,0,.22)
        );
}

.pumpkin-slot.opened.has-candy
.candy-inside {

    animation:
        candyInside .45s .18s
        ease forwards;
}

@keyframes candyInside {
    from {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.45);
    }

    to {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}

.pumpkin-slot.candy-leaving
.candy-inside {
    opacity: 0 !important;
}

/* =====================================================
   ПИСТОЛЕТ
===================================================== */

#gunWrap {
    position: absolute;

    left: 50%;

    /*
       Пистолет заметно выше,
       чем в первой версии.
    */
    bottom: 3%;

    width: clamp(190px,19vw,325px);
    height: clamp(300px,39vh,490px);

    transform:
        translateX(-50%)
        rotate(0deg);

    transform-origin: 50% 100%;

    z-index: 450;

    pointer-events: none;
}

#gun {
    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: bottom center;

    filter:
        drop-shadow(
            0 10px 15px rgba(0,0,0,.32)
        );
}

#gunWrap.recoil #gun {
    animation: recoil .16s ease-out;
}

@keyframes recoil {
    0% {
        transform: translateY(0);
    }

    40% {
        transform: translateY(11px);
    }

    100% {
        transform: translateY(0);
    }
}

/* =====================================================
   ПРИЦЕЛ
===================================================== */

#crosshair {
    position: absolute;

    left: 50%;
    top: 45%;

    width: 48px;
    height: 48px;

    transform: translate(-50%,-50%);

    z-index: 1000;

    pointer-events: none;

    border:
        3px solid rgba(126,239,255,.95);

    border-radius: 50%;

    box-shadow:
        0 0 9px #65eaff,
        inset 0 0 8px rgba(90,230,255,.5);
}

#crosshair::before,
#crosshair::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    background: #c8fbff;

    box-shadow:
        0 0 7px #6defff;
}

#crosshair::before {
    width: 62px;
    height: 2px;
}

#crosshair::after {
    width: 2px;
    height: 62px;
}

.crosshair-dot {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 7px;
    height: 7px;

    transform: translate(-50%,-50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 9px #65eaff;
}

#crosshair.on-target {
    border-color: #ffe36c;

    box-shadow:
        0 0 14px #ffd75e,
        inset 0 0 10px rgba(255,221,82,.65);
}

#playScreen.reward-mode #crosshair {
    display: none;
}

/* =====================================================
   ЛАЗЕР
===================================================== */

#laser {
    position: absolute;

    height: 6px;

    border-radius: 999px;

    transform-origin: 0 50%;

    opacity: 0;

    z-index: 420;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            #eaffff,
            #7ff4ff 35%,
            rgba(65,190,255,.8)
        );

    box-shadow:
        0 0 5px white,
        0 0 11px #75f4ff,
        0 0 22px rgba(68,190,255,.9);
}

#laser.fire {
    animation: laserFire .18s ease-out;
}

@keyframes laserFire {
    0% {
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    68% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

/* =====================================================
   ВСПЫШКА
===================================================== */

.hit-flash {
    position: absolute;

    width: 72px;
    height: 72px;

    border-radius: 50%;

    transform:
        translate(-50%,-50%)
        scale(.1);

    z-index: 600;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            white 0%,
            #b9f7ff 20%,
            #62dbff 37%,
            rgba(77,163,255,.30) 58%,
            transparent 72%
        );

    animation:
        hitFlash .30s ease-out forwards;
}

@keyframes hitFlash {
    from {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    to {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(1.7);
    }
}

/* =====================================================
   КОНФЕТЫ НА ПЕРЕДНЕМ ПЛАНЕ
===================================================== */

#reward {
    position: fixed;

    left: 0;
    top: 0;

    width: clamp(240px,27vw,420px);

    z-index: 1300;

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%,-50%)
        scale(.55);

    filter:
        drop-shadow(
            0 18px 18px rgba(0,0,0,.32)
        );
}

/*
   Координаты задаются JS.
*/

#reward.flying {
    opacity: 1;

    transition:
        left .78s cubic-bezier(.2,.8,.25,1),
        top .78s cubic-bezier(.2,.8,.25,1),
        transform .78s cubic-bezier(.2,1.1,.3,1);
}

#reward.arrived {
    transform:
        translate(-50%,-50%)
        scale(1);
}

/* =====================================================
   ЗАБРАТЬ КОНФЕТЫ
===================================================== */

#collectBtn {
    position: absolute;

    left: 50%;
    top: 72%;

    transform:
        translate(-50%,15px)
        scale(.9);

    z-index: 1400;

    min-width: 275px;

    padding: 16px 30px;

    border:
        2px solid rgba(255,255,255,.7);

    border-radius: 22px;

    background:
        linear-gradient(
            180deg,
            #ffe46e,
            #ff9f32
        );

    color: #542c57;

    font-size:
        clamp(20px,2.2vw,29px);

    font-weight: 900;

    box-shadow:
        0 12px 30px rgba(0,0,0,.30),
        inset 0 2px 0 rgba(255,255,255,.65);

    opacity: 0;

    visibility: hidden;

    cursor: pointer;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

#collectBtn.show {
    opacity: 1;
    visibility: visible;

    transform:
        translate(-50%,0)
        scale(1);
}

#collectBtn:hover {
    transform:
        translate(-50%,0)
        scale(1.04);
}

/* =====================================================
   МОБИЛЬНЫЕ
===================================================== */

@media(max-width:720px) {
    .setup-card {
        padding: 22px 18px;
    }

    .letter-btn {
        width: 45px;
        height: 45px;
        font-size: 20px;
    }

    .syllable-types {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- =================================================
         НАСТРОЙКА
    ================================================== -->

    <div id="setupScreen">

        <div class="setup-card">

            <div class="setup-title">
                Тыквенный тир
            </div>

            <div class="setup-subtitle">
                Выбери буквы, из которых будут составлены слоги.
                Можно выбрать до 8 букв.
            </div>

            <div class="counter-wrap">
                <div class="counter">
                    Выбрано:
                    <span id="selectedCount">
                        &nbsp;0 / 8
                    </span>
                </div>
            </div>

            <div class="section">

                <div class="section-title">
                    Согласные
                </div>

                <div
                    class="letters"
                    id="consonants">
                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    Гласные
                </div>

                <div
                    class="letters"
                    id="vowels">
                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    Тип слогов
                </div>

                <div class="syllable-types">

                    <button
                        class="type-btn selected"
                        data-type="open">

                        <strong>
                            Открытые
                        </strong>

                        <span>
                            СА · МО · ЛУ
                        </span>

                    </button>

                    <button
                        class="type-btn"
                        data-type="closed">

                        <strong>
                            Закрытые
                        </strong>

                        <span>
                            АС · ОМ · УЛ
                        </span>

                    </button>

                    <button
                        class="type-btn"
                        data-type="mixed">

                        <strong>
                            Смешанные
                        </strong>

                        <span>
                            СА · АС · МО · ОМ
                        </span>

                    </button>

                </div>

            </div>

            <div id="error"></div>

            <button
                class="start-btn"
                id="startBtn">
                Начать игру
            </button>

        </div>

    </div>

    <!-- =================================================
         ИГРА
    ================================================== -->

    <div id="playScreen">

        <button id="settingsBtn">
            ⚙
        </button>

        <div id="pumpkinField"></div>

        <div id="laser"></div>

        <div id="gunWrap">
            <img
                id="gun"
                src="pistolet.png"
                alt=""
                draggable="false">
        </div>

        <div id="crosshair">
            <div class="crosshair-dot"></div>
        </div>

        <img
            id="reward"
            src="konfet.png"
            alt=""
            draggable="false">

        <button id="collectBtn">
            Забрать конфеты
        </button>

    </div>

</div>

<script>

/* =====================================================
   СОСТОЯНИЕ
===================================================== */

const MAX_LETTERS = 8;

const consonantLetters = [
    "М","Н","П","Б","Т","Д",
    "К","Г","Х","Ф","В",
    "С","З","Ц",
    "Ш","Ж","Ч","Щ",
    "Л","Р"
];

const vowelLetters = [
    "А","О","У","Ы","Э",
    "И","Е","Ё","Ю","Я"
];

let selectedConsonants = new Set();
let selectedVowels = new Set();

let syllableType = "open";

let syllables = [];

let gameLocked = false;

let currentCandyPumpkin = null;

let lastMouseX = window.innerWidth / 2;
let lastMouseY = window.innerHeight / 2;

let pumpkinCounter = 0;

/* =====================================================
   DOM
===================================================== */

const setupScreen =
    document.getElementById("setupScreen");

const playScreen =
    document.getElementById("playScreen");

const consonantsBox =
    document.getElementById("consonants");

const vowelsBox =
    document.getElementById("vowels");

const selectedCount =
    document.getElementById("selectedCount");

const errorBox =
    document.getElementById("error");

const startBtn =
    document.getElementById("startBtn");

const settingsBtn =
    document.getElementById("settingsBtn");

const pumpkinField =
    document.getElementById("pumpkinField");

const gunWrap =
    document.getElementById("gunWrap");

const crosshair =
    document.getElementById("crosshair");

const laser =
    document.getElementById("laser");

const reward =
    document.getElementById("reward");

const collectBtn =
    document.getElementById("collectBtn");

/* =====================================================
   БУКВЫ
===================================================== */

function createLetterButtons(
    letters,
    container,
    group
) {

    letters.forEach(letter => {

        const button =
            document.createElement("button");

        button.className =
            "letter-btn";

        button.textContent =
            letter;

        button.dataset.letter =
            letter;

        button.dataset.group =
            group;

        button.addEventListener(
            "click",
            () => toggleLetter(button)
        );

        container.appendChild(button);

    });

}

createLetterButtons(
    consonantLetters,
    consonantsBox,
    "consonant"
);

createLetterButtons(
    vowelLetters,
    vowelsBox,
    "vowel"
);

function toggleLetter(button) {

    errorBox.textContent = "";

    const letter =
        button.dataset.letter;

    const set =
        button.dataset.group === "consonant"
        ? selectedConsonants
        : selectedVowels;

    if (set.has(letter)) {

        set.delete(letter);

        button.classList.remove(
            "selected"
        );

    } else {

        const total =
            selectedConsonants.size +
            selectedVowels.size;

        if (total >= MAX_LETTERS) {

            errorBox.textContent =
                "Можно выбрать максимум 8 букв.";

            return;

        }

        set.add(letter);

        button.classList.add(
            "selected"
        );

    }

    updateCounter();

}

function updateCounter() {

    const total =
        selectedConsonants.size +
        selectedVowels.size;

    selectedCount.textContent =
        ` ${total} / ${MAX_LETTERS}`;

}

/* =====================================================
   ТИП СЛОГОВ
===================================================== */

document
.querySelectorAll(".type-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".type-btn")
            .forEach(btn =>
                btn.classList.remove(
                    "selected"
                )
            );

            button.classList.add(
                "selected"
            );

            syllableType =
                button.dataset.type;

        }
    );

});

/* =====================================================
   СОЗДАЁМ СЛОГИ
===================================================== */

function buildSyllables() {

    const result = [];

    const consonants =
        [...selectedConsonants];

    const vowels =
        [...selectedVowels];

    consonants.forEach(c => {

        vowels.forEach(v => {

            if (
                syllableType === "open" ||
                syllableType === "mixed"
            ) {
                result.push(c + v);
            }

            if (
                syllableType === "closed" ||
                syllableType === "mixed"
            ) {
                result.push(v + c);
            }

        });

    });

    return shuffle(
        [...new Set(result)]
    );

}

/* =====================================================
   СТАРТ
===================================================== */

startBtn.addEventListener(
    "click",
    startGame
);

function startGame() {

    errorBox.textContent = "";

    if (
        selectedConsonants.size === 0
    ) {

        errorBox.textContent =
            "Выбери хотя бы одну согласную.";

        return;

    }

    if (
        selectedVowels.size === 0
    ) {

        errorBox.textContent =
            "Выбери хотя бы одну гласную.";

        return;

    }

    syllables =
        buildSyllables();

    setupScreen.style.display =
        "none";

    playScreen.classList.add(
        "active",
        "aiming"
    );

    playScreen.classList.remove(
        "reward-mode"
    );

    startField();

}

/* =====================================================
   ПОЗИЦИИ
===================================================== */

/*
   Первые 4 используются при старте.

   Остальные - только после успешного
   нахождения конфет.
*/

const positions = [

    {x:18, y:57, scale:.88},
    {x:39, y:48, scale:.82},
    {x:62, y:49, scale:.84},
    {x:83, y:58, scale:.90},

    {x:28, y:68, scale:.88},
    {x:73, y:68, scale:.88},
    {x:50, y:61, scale:.87},
    {x:10, y:69, scale:.82},
    {x:90, y:69, scale:.82},
    {x:50, y:38, scale:.75}

];

/* =====================================================
   НАЧАЛО ПОЛЯ
===================================================== */

function startField() {

    pumpkinField.innerHTML = "";

    pumpkinCounter = 0;

    currentCandyPumpkin = null;

    gameLocked = false;

    /*
       СТРОГО ЧЕТЫРЕ.
    */

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        createPumpkin(
            positions[i]
        );

    }

    chooseCandyPumpkin();

}

/* =====================================================
   НОВАЯ ПОЗИЦИЯ
===================================================== */

function getNextPosition() {

    /*
       pumpkinCounter уже включает
       четыре стартовые тыквы.
    */

    if (
        pumpkinCounter <
        positions.length
    ) {

        return positions[
            pumpkinCounter
        ];

    }

    /*
       Только для очень долгой игры.
    */

    return {
        x: 14 + Math.random() * 72,
        y: 39 + Math.random() * 31,
        scale: .76 + Math.random() * .13
    };

}

/* =====================================================
   СОЗДАНИЕ ТЫКВЫ
===================================================== */

function createPumpkin(position) {

    const slot =
        document.createElement("div");

    slot.className =
        "pumpkin-slot";

    slot.dataset.hasCandy = "0";

    slot.dataset.id =
        String(++pumpkinCounter);

    slot.style.left =
        position.x + "%";

    slot.style.top =
        position.y + "%";

    slot.style.scale =
        position.scale;

    /* конфеты */

    const candy =
        document.createElement("img");

    candy.src = "konfet.png";

    candy.className =
        "candy-inside";

    candy.draggable = false;

    /* половинки */

    const left =
        document.createElement("img");

    left.src =
        "pumpkin_left.png";

    left.className =
        "half left-half";

    left.draggable = false;

    const right =
        document.createElement("img");

    right.src =
        "pumpkin_right.png";

    right.className =
        "half right-half";

    right.draggable = false;

    /* целая */

    const whole =
        document.createElement("img");

    whole.src =
        "tikva.png";

    whole.className =
        "whole-pumpkin";

    whole.draggable = false;

    /* слог */

    const syllable =
        document.createElement("div");

    syllable.className =
        "syllable";

    syllable.textContent =
        getRandomSyllable();

    /*
       Порядок слоёв:
       конфеты -> половинки -> целая -> текст.
    */

    slot.appendChild(candy);
    slot.appendChild(left);
    slot.appendChild(right);
    slot.appendChild(whole);
    slot.appendChild(syllable);

    slot.addEventListener(
        "pointerenter",
        () => {

            if (
                gameLocked ||
                slot.classList.contains(
                    "opened"
                )
            ) {
                return;
            }

            slot.classList.add(
                "targeted"
            );

            crosshair.classList.add(
                "on-target"
            );

        }
    );

    slot.addEventListener(
        "pointerleave",
        () => {

            slot.classList.remove(
                "targeted"
            );

            crosshair.classList.remove(
                "on-target"
            );

        }
    );

    slot.addEventListener(
        "pointerdown",
        event => {

            if (
                gameLocked ||
                slot.classList.contains(
                    "opened"
                )
            ) {
                return;
            }

            event.preventDefault();
            event.stopPropagation();

            /*
               Используем именно координаты
               прицела/мыши, а не центр тыквы.
            */

            shootPumpkin(
                slot,
                event.clientX,
                event.clientY
            );

        }
    );

    pumpkinField.appendChild(slot);

}

/* =====================================================
   СЛУЧАЙНЫЙ СЛОГ
===================================================== */

function getRandomSyllable() {

    return syllables[
        Math.floor(
            Math.random() *
            syllables.length
        )
    ];

}

/* =====================================================
   ГДЕ СПРЯТАНЫ КОНФЕТЫ
===================================================== */

function chooseCandyPumpkin() {

    const available =
        [
            ...document.querySelectorAll(
                ".pumpkin-slot:not(.opened)"
            )
        ];

    /*
       Сбрасываем старый тайник.
    */

    available.forEach(slot => {

        slot.dataset.hasCandy =
            "0";

        slot.classList.remove(
            "has-candy"
        );

    });

    if (
        available.length === 0
    ) {
        return;
    }

    currentCandyPumpkin =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];

    currentCandyPumpkin
        .dataset.hasCandy =
        "1";

}

/* =====================================================
   ВЫСТРЕЛ
===================================================== */

function shootPumpkin(
    slot,
    hitX,
    hitY
) {

    if (gameLocked) {
        return;
    }

    if (
        slot.classList.contains(
            "opened"
        )
    ) {
        return;
    }

    /*
       Сразу блокируем конкретную тыкву,
       чтобы двойной клик не запускал
       два выстрела.
    */

    slot.classList.add(
        "opened"
    );

    slot.classList.remove(
        "targeted"
    );

    crosshair.classList.remove(
        "on-target"
    );

    fireLaser(
        hitX,
        hitY
    );

    createFlash(
        hitX,
        hitY
    );

    gunWrap.classList.remove(
        "recoil"
    );

    void gunWrap.offsetWidth;

    gunWrap.classList.add(
        "recoil"
    );

    const found =
        slot.dataset.hasCandy === "1";

    if (!found) {

        /*
           ПУСТО.

           Ничего больше не происходит.
           Половинки остаются на поляне.
           Новая тыква НЕ появляется.
        */

        return;

    }

    /*
       НАШЛИ КОНФЕТЫ.
    */

    gameLocked = true;

    slot.classList.add(
        "has-candy"
    );

    /*
       Сначала даём ребёнку хорошо
       увидеть конфеты ВНУТРИ.
    */

    setTimeout(
        () => {

            flyCandyFromPumpkin(
                slot
            );

        },
        1450
    );

}

/* =====================================================
   КОНФЕТЫ ВЫЛЕТАЮТ ИЗ КОНКРЕТНОЙ ТЫКВЫ
===================================================== */

function flyCandyFromPumpkin(slot) {

    const candyInside =
        slot.querySelector(
            ".candy-inside"
        );

    const candyRect =
        candyInside
        .getBoundingClientRect();

    /*
       Стартовая точка точно там,
       где сейчас находятся конфеты
       внутри тыквы.
    */

    const startX =
        candyRect.left +
        candyRect.width / 2;

    const startY =
        candyRect.top +
        candyRect.height / 2;

    slot.classList.add(
        "candy-leaving"
    );

    reward.classList.remove(
        "flying",
        "arrived"
    );

    /*
       Ставим копию конфет в точку,
       откуда они вылетают.
    */

    reward.style.transition =
        "none";

    reward.style.left =
        startX + "px";

    reward.style.top =
        startY + "px";

    reward.style.opacity =
        "1";

    reward.style.transform =
        "translate(-50%,-50%) scale(.42)";

    void reward.offsetWidth;

    /*
       Теперь включаем переход.
    */

    reward.style.transition = "";

    reward.classList.add(
        "flying"
    );

    /*
       Центральная точка назначения.
    */

    const destinationX =
        window.innerWidth * .50;

    const destinationY =
        window.innerHeight * .43;

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    reward.style.left =
                        destinationX + "px";

                    reward.style.top =
                        destinationY + "px";

                    reward.classList.add(
                        "arrived"
                    );

                }
            );

        }
    );

    /*
       Во время полёта выключаем тир.
       Возвращаем обычную мышь.
    */

    playScreen.classList.remove(
        "aiming"
    );

    playScreen.classList.add(
        "reward-mode"
    );

    /*
       Кнопка появляется только
       после завершения полёта.
    */

    setTimeout(
        () => {

            collectBtn.classList.add(
                "show"
            );

        },
        850
    );

}

/* =====================================================
   ЗАБРАТЬ КОНФЕТЫ
===================================================== */

collectBtn.addEventListener(
    "click",
    event => {

        event.preventDefault();
        event.stopPropagation();

        collectBtn.classList.remove(
            "show"
        );

        /*
           Красиво уменьшаем конфеты.
        */

        reward.style.transition =
            "transform .32s ease, opacity .32s ease";

        reward.style.transform =
            "translate(-50%,-50%) scale(.2)";

        reward.style.opacity =
            "0";

        setTimeout(
            () => {

                reward.classList.remove(
                    "flying",
                    "arrived"
                );

                reward.style.transition =
                    "";

                /*
                   У старой найденной тыквы
                   конфет больше нет.
                */

                if (
                    currentCandyPumpkin
                ) {

                    currentCandyPumpkin
                        .dataset.hasCandy =
                        "0";

                    currentCandyPumpkin
                        .classList.remove(
                            "has-candy"
                        );

                }

                /*
                   ТОЛЬКО ЗДЕСЬ
                   появляется одна новая
                   целая тыква.
                */

                const newPosition =
                    getNextPosition();

                createPumpkin(
                    newPosition
                );

                /*
                   Теперь перепрятываем
                   конфеты среди ВСЕХ
                   целых тыкв.

                   Старая непростреленная
                   тоже может стать тайником.

                   Новая тоже может.
                */

                chooseCandyPumpkin();

                gameLocked = false;

                playScreen.classList.remove(
                    "reward-mode"
                );

                playScreen.classList.add(
                    "aiming"
                );

            },
            340
        );

    }
);

/* =====================================================
   ПОВОРОТ ПИСТОЛЕТА
===================================================== */

playScreen.addEventListener(
    "pointermove",
    event => {

        lastMouseX =
            event.clientX;

        lastMouseY =
            event.clientY;

        if (gameLocked) {
            return;
        }

        crosshair.style.left =
            event.clientX + "px";

        crosshair.style.top =
            event.clientY + "px";

        aimGunAt(
            event.clientX,
            event.clientY
        );

    }
);

function aimGunAt(
    targetX,
    targetY
) {

    /*
       Центр вращения пистолета.
    */

    const rect =
        gunWrap.getBoundingClientRect();

    const pivotX =
        rect.left +
        rect.width / 2;

    const pivotY =
        rect.bottom;

    const dx =
        targetX - pivotX;

    const dy =
        pivotY - targetY;

    let angle =
        Math.atan2(
            dx,
            Math.max(dy,80)
        ) *
        180 /
        Math.PI;

    angle =
        Math.max(
            -34,
            Math.min(
                34,
                angle
            )
        );

    gunWrap.dataset.angle =
        angle;

    gunWrap.style.transform =
        `translateX(-50%) rotate(${angle}deg)`;

}

/* =====================================================
   ТОЧНАЯ ТОЧКА ДУЛА
===================================================== */

function getMuzzlePoint() {

    const rect =
        gunWrap.getBoundingClientRect();

    /*
       В PNG дуло находится по центру
       примерно в верхней части картинки.

       Эта точка рассчитывается
       относительно самого пистолета.
    */

    const pivotX =
        rect.left +
        rect.width / 2;

    const pivotY =
        rect.bottom;

    /*
       Расстояние от нижней точки
       вращения до дула.
    */

    const muzzleDistance =
        rect.height * .78;

    const angleDeg =
        Number(
            gunWrap.dataset.angle || 0
        );

    const angle =
        angleDeg *
        Math.PI / 180;

    /*
       При 0 градусов дуло находится
       строго над pivot.
    */

    const muzzleX =
        pivotX +
        Math.sin(angle) *
        muzzleDistance;

    const muzzleY =
        pivotY -
        Math.cos(angle) *
        muzzleDistance;

    return {
        x: muzzleX,
        y: muzzleY
    };

}

/* =====================================================
   ЛАЗЕР ОТ ДУЛА ДО ПРИЦЕЛА
===================================================== */

function fireLaser(
    targetX,
    targetY
) {

    const muzzle =
        getMuzzlePoint();

    const dx =
        targetX -
        muzzle.x;

    const dy =
        targetY -
        muzzle.y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const angle =
        Math.atan2(
            dy,
            dx
        ) *
        180 /
        Math.PI;

    laser.style.left =
        muzzle.x + "px";

    laser.style.top =
        muzzle.y + "px";

    laser.style.width =
        distance + "px";

    laser.style.transform =
        `rotate(${angle}deg)`;

    laser.classList.remove(
        "fire"
    );

    void laser.offsetWidth;

    laser.classList.add(
        "fire"
    );

}

/* =====================================================
   ВСПЫШКА
===================================================== */

function createFlash(
    x,
    y
) {

    const flash =
        document.createElement(
            "div"
        );

    flash.className =
        "hit-flash";

    flash.style.left =
        x + "px";

    flash.style.top =
        y + "px";

    playScreen.appendChild(
        flash
    );

    setTimeout(
        () => flash.remove(),
        350
    );

}

/* =====================================================
   НАСТРОЙКИ
===================================================== */

settingsBtn.addEventListener(
    "click",
    () => {

        playScreen.classList.remove(
            "active",
            "aiming",
            "reward-mode"
        );

        setupScreen.style.display =
            "flex";

        pumpkinField.innerHTML =
            "";

        collectBtn.classList.remove(
            "show"
        );

        reward.classList.remove(
            "flying",
            "arrived"
        );

        reward.style.opacity =
            "0";

        gameLocked = false;

    }
);

/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    for (
        let i =
            array.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];

    }

    return array;

}
