<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тыквенный тир</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #10152d;
}

button {
    font: inherit;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: url("fon.png") center center / cover no-repeat;
}

/* =========================================================
   МЕНЮ
========================================================= */

#setupScreen {
    position: absolute;
    inset: 0;
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(7,10,34,.43);
    backdrop-filter: blur(5px);
}

.setup-card {
    width: min(930px,94vw);
    max-height: 94vh;
    overflow-y: auto;
    padding: 30px 34px 32px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,.26);
    background: linear-gradient(
        145deg,
        rgba(38,32,78,.95),
        rgba(21,27,68,.93)
    );
    box-shadow:
        0 25px 70px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.18);
    color: white;
}

.setup-title {
    text-align: center;
    font-size: clamp(29px,3.3vw,48px);
    font-weight: 900;
    color: #fff2c2;
    margin-bottom: 8px;
}

.setup-subtitle {
    text-align: center;
    font-size: clamp(14px,1.4vw,19px);
    line-height: 1.4;
    opacity: .9;
    margin-bottom: 20px;
}

.counter-wrap {
    text-align: center;
}

.counter {
    display: inline-flex;
    padding: 9px 16px;
    margin-bottom: 23px;
    border-radius: 999px;
    background: rgba(255,255,255,.11);
    border: 1px solid rgba(255,255,255,.17);
    font-size: 17px;
    font-weight: 800;
}

.section {
    margin-bottom: 23px;
}

.section-title {
    margin-bottom: 11px;
    color: #ffd87b;
    font-size: 20px;
    font-weight: 900;
}

.letters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.letter-btn {
    width: 53px;
    height: 53px;
    border-radius: 15px;
    border: 2px solid rgba(255,255,255,.20);
    background: rgba(255,255,255,.10);
    color: white;
    font-size: 23px;
    font-weight: 900;
    cursor: pointer;
    transition: .15s ease;
}

.letter-btn:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.17);
}

.letter-btn.selected {
    color: #37235d;
    background: linear-gradient(145deg,#ffe76f,#ffb941);
    border-color: #fff2a9;
    box-shadow: 0 6px 18px rgba(255,185,65,.34);
    transform: translateY(-2px);
}

.syllable-types {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.type-btn {
    min-height: 80px;
    padding: 12px;
    border-radius: 18px;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.09);
    color: white;
    cursor: pointer;
}

.type-btn strong {
    display: block;
    font-size: 18px;
    margin-bottom: 5px;
}

.type-btn span {
    font-size: 14px;
    opacity: .78;
}

.type-btn.selected {
    background: linear-gradient(
        145deg,
        rgba(114,219,255,.95),
        rgba(91,139,255,.95)
    );
    border-color: #c8f4ff;
    box-shadow: 0 7px 22px rgba(77,160,255,.35);
}

#error {
    min-height: 24px;
    margin-top: 12px;
    text-align: center;
    color: #ffd0cf;
    font-weight: 700;
}

.start-btn {
    display: block;
    width: min(350px,100%);
    min-height: 61px;
    margin: 6px auto 0;
    border: 0;
    border-radius: 20px;
    background: linear-gradient(180deg,#ffdd65,#ff9e30);
    color: #4a2756;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(255,151,38,.32);
}

/* =========================================================
   ИГРА
========================================================= */

#playScreen {
    position: absolute;
    inset: 0;
    display: none;
    overflow: hidden;
}

#playScreen.active {
    display: block;
}

#playScreen.aiming {
    cursor: none;
}

#playScreen.reward-mode {
    cursor: default;
}

#settingsBtn {
    position: absolute;
    top: 22px;
    right: 22px;
    z-index: 2500;
    width: 54px;
    height: 54px;
    border: 1px solid rgba(255,255,255,.30);
    border-radius: 17px;
    background: rgba(24,25,65,.72);
    color: white;
    font-size: 25px;
    cursor: pointer;
}

#pumpkinField {
    position: absolute;
    inset: 0;
    z-index: 100;
}

/* =========================================================
   ТЫКВЫ
========================================================= */

.pumpkin-slot {
    position: absolute;
    width: clamp(165px,17vw,290px);
    aspect-ratio: 1.36;
    transform:
        translate(-50%,-50%)
        scale(var(--pumpkin-scale,1));
    transform-origin: center;
}

.whole-pumpkin {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 30;
    filter: drop-shadow(0 13px 10px rgba(0,0,0,.25));
    transition:
        opacity .08s linear,
        transform .15s ease,
        filter .15s ease;
}

.pumpkin-slot.targeted .whole-pumpkin {
    transform: scale(1.035);
    filter:
        brightness(1.08)
        drop-shadow(0 13px 11px rgba(0,0,0,.28));
}

.syllable {
    position: absolute;
    left: 50%;
    top: 56%;
    transform: translate(-50%,-50%);
    z-index: 40;
    font-size: clamp(30px,3.7vw,57px);
    line-height: 1;
    font-weight: 1000;
    color: #fff8db;
    text-shadow:
        0 3px 0 #8c3e12,
        0 5px 10px rgba(0,0,0,.45);
    pointer-events: none;
}

/* =========================================================
   ПОЛОВИНКИ
========================================================= */

.half {
    position: absolute;
    top: 0;
    width: 54%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    z-index: 25;
    pointer-events: none;
    filter: drop-shadow(0 12px 9px rgba(0,0,0,.25));
}

.left-half {
    left: 23%;
}

.right-half {
    right: 23%;
}

.pumpkin-slot.opened .whole-pumpkin,
.pumpkin-slot.opened .syllable {
    opacity: 0;
}

.pumpkin-slot.opened .left-half {
    animation: openLeft .72s cubic-bezier(.18,.78,.24,1) forwards;
}

.pumpkin-slot.opened .right-half {
    animation: openRight .72s cubic-bezier(.18,.78,.24,1) forwards;
}

@keyframes openLeft {
    0% {
        opacity: 1;
        transform: translateX(0) rotate(0deg);
    }
    100% {
        opacity: 1;
        transform: translateX(-58%) rotate(-11deg);
    }
}

@keyframes openRight {
    0% {
        opacity: 1;
        transform: translateX(0) rotate(0deg);
    }
    100% {
        opacity: 1;
        transform: translateX(58%) rotate(11deg);
    }
}

/* =========================================================
   КОНФЕТЫ
========================================================= */

.candy-inside {
    position: absolute;
    left: 50%;
    top: 55%;
    width: 40%;
    transform: translate(-50%,-50%) scale(.9);
    opacity: 0;
    z-index: 35;
    pointer-events: none;
    filter: drop-shadow(0 6px 7px rgba(0,0,0,.24));
}

.pumpkin-slot.opened.has-candy .candy-inside {
    opacity: 1;
}

.pumpkin-slot.candy-flying .candy-inside {
    display: none;
}

/* =========================================================
   ПИСТОЛЕТ
========================================================= */

#gunWrap {
    position: absolute;
    left: 50%;
    bottom: -3%;
    width: clamp(185px,17vw,285px);
    height: clamp(300px,38vh,460px);
    transform: translateX(-50%) rotate(0deg);
    transform-origin: 50% 92%;
    z-index: 450;
    pointer-events: none;
}

#gun {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center bottom;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.32));
}

#gunWrap.recoil #gun {
    animation: recoil .17s ease-out;
}

@keyframes recoil {
    0% { transform: translateY(0); }
    40% { transform: translateY(7px); }
    100% { transform: translateY(0); }
}

/* =========================================================
   ПРИЦЕЛ
========================================================= */

#crosshair {
    position: absolute;
    left: 50%;
    top: 45%;
    width: 48px;
    height: 48px;
    transform: translate(-50%,-50%);
    z-index: 1200;
    pointer-events: none;
    border: 3px solid rgba(126,239,255,.95);
    border-radius: 50%;
    box-shadow:
        0 0 9px #65eaff,
        inset 0 0 8px rgba(90,230,255,.5);
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    background: #c8fbff;
    box-shadow: 0 0 7px #6defff;
}

#crosshair::before {
    width: 62px;
    height: 2px;
}

#crosshair::after {
    width: 2px;
    height: 62px;
}

.crosshair-dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 7px;
    height: 7px;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 9px #65eaff;
}

#crosshair.on-target {
    border-color: #ffe36c;
    box-shadow:
        0 0 14px #ffd75e,
        inset 0 0 10px rgba(255,221,82,.65);
}

#playScreen.reward-mode #crosshair {
    display: none;
}

/* =========================================================
   ЛАЗЕР
========================================================= */

#laser {
    position: absolute;
    height: 5px;
    border-radius: 999px;
    transform-origin: 0 50%;
    opacity: 0;
    z-index: 430;
    pointer-events: none;
    background: linear-gradient(
        90deg,
        white,
        #91f8ff 20%,
        #4edbff 65%,
        rgba(69,187,255,.65)
    );
    box-shadow:
        0 0 4px white,
        0 0 9px #73efff,
        0 0 18px rgba(60,190,255,.9);
}

#laser.fire {
    animation: laserFire .20s ease-out;
}

@keyframes laserFire {
    0% { opacity: 0; }
    8% { opacity: 1; }
    65% { opacity: 1; }
    100% { opacity: 0; }
}

/* =========================================================
   ВСПЫШКА
========================================================= */

.hit-flash {
    position: absolute;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    transform: translate(-50%,-50%) scale(.1);
    z-index: 600;
    pointer-events: none;
    background: radial-gradient(
        circle,
        white 0%,
        #b9f7ff 20%,
        #62dbff 38%,
        rgba(77,163,255,.28) 58%,
        transparent 72%
    );
    animation: hitFlash .30s ease-out forwards;
}

@keyframes hitFlash {
    from {
        opacity: 1;
        transform: translate(-50%,-50%) scale(.1);
    }
    to {
        opacity: 0;
        transform: translate(-50%,-50%) scale(1.7);
    }
}

/* =========================================================
   ЛЕТЯЩИЕ КОНФЕТЫ
========================================================= */

#flyingCandy {
    position: fixed;
    left: 0;
    top: 0;
    width: 1px;
    z-index: 1800;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%,-50%);
    filter: drop-shadow(0 15px 17px rgba(0,0,0,.30));
    will-change: left,top,width,opacity;
}

/* =========================================================
   КНОПКА КОНФЕТ
========================================================= */

#collectBtn {
    position: absolute;
    left: 50%;
    top: 72%;
    transform: translate(-50%,12px) scale(.92);
    z-index: 2000;
    min-width: 275px;
    padding: 16px 30px;
    border: 2px solid rgba(255,255,255,.7);
    border-radius: 22px;
    background: linear-gradient(180deg,#ffe46e,#ff9f32);
    color: #542c57;
    font-size: clamp(20px,2.1vw,29px);
    font-weight: 900;
    box-shadow:
        0 12px 30px rgba(0,0,0,.30),
        inset 0 2px 0 rgba(255,255,255,.65);
    opacity: 0;
    visibility: hidden;
    cursor: pointer;
    transition:
        opacity .25s ease,
        transform .25s ease;
}

#collectBtn.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%,0) scale(1);
}

/* =========================================================
   ФИНАЛ
========================================================= */

#finishScreen {
    position: absolute;
    inset: 0;
    z-index: 4000;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(8,10,34,.42);
    backdrop-filter: blur(5px);
}

#finishScreen.show {
    display: flex;
}

.finish-card {
    width: min(570px,90vw);
    padding: 38px 32px;
    border-radius: 30px;

    text-align: center;
    color: white;

    border: 1px solid rgba(255,255,255,.3);

    background:
        linear-gradient(
            145deg,
            rgba(50,38,90,.96),
            rgba(22,29,69,.96)
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.2);
}

.finish-title {
    color: #ffe37a;
    font-size: clamp(30px,4vw,48px);
    font-weight: 900;
    margin-bottom: 12px;
}

.finish-text {
    font-size: clamp(18px,2vw,23px);
    line-height: 1.4;
    margin-bottom: 28px;
}

.finish-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
}

.finish-btn {
    min-width: 210px;
    min-height: 58px;
    padding: 12px 20px;
    border: 0;
    border-radius: 18px;
    font-size: 19px;
    font-weight: 900;
    cursor: pointer;
}

#replayBtn {
    background: linear-gradient(180deg,#ffe46e,#ff9f32);
    color: #542c57;
}

#newSettingsBtn {
    background: linear-gradient(180deg,#8eeeff,#669cff);
    color: #27335f;
}

@media(max-width:720px) {
    .setup-card {
        padding: 22px 18px;
    }

    .letter-btn {
        width: 45px;
        height: 45px;
        font-size: 20px;
    }

    .syllable-types {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- НАСТРОЙКА -->

    <div id="setupScreen">

        <div class="setup-card">

            <div class="setup-title">
                Тыквенный тир
            </div>

            <div class="setup-subtitle">
                Выбери буквы для слогов.
                Всего можно выбрать до 8 букв.
            </div>

            <div class="counter-wrap">
                <div class="counter">
                    Выбрано:
                    <span id="selectedCount">&nbsp;0 / 8</span>
                </div>
            </div>

            <div class="section">

                <div class="section-title">
                    Согласные
                </div>

                <div
                    class="letters"
                    id="consonants">
                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    Гласные
                </div>

                <div
                    class="letters"
                    id="vowels">
                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    Тип слогов
                </div>

                <div class="syllable-types">

                    <button
                        class="type-btn selected"
                        data-type="open">

                        <strong>Открытые</strong>
                        <span>СА · МО · ЛУ</span>

                    </button>

                    <button
                        class="type-btn"
                        data-type="closed">

                        <strong>Закрытые</strong>
                        <span>АС · ОМ · УЛ</span>

                    </button>

                    <button
                        class="type-btn"
                        data-type="mixed">

                        <strong>Смешанные</strong>
                        <span>СА · АС · МО · ОМ</span>

                    </button>

                </div>

            </div>

            <div id="error"></div>

            <button
                class="start-btn"
                id="startBtn">
                Начать игру
            </button>

        </div>

    </div>


    <!-- ИГРА -->

    <div id="playScreen">

        <button id="settingsBtn">
            ⚙
        </button>

        <div id="pumpkinField"></div>

        <div id="laser"></div>

        <div id="gunWrap">

            <img
                id="gun"
                src="pistolet.png"
                draggable="false"
                alt="">

        </div>

        <div id="crosshair">
            <div class="crosshair-dot"></div>
        </div>

        <img
            id="flyingCandy"
            src="konfet.png"
            draggable="false"
            alt="">

        <button id="collectBtn">
            Забрать конфеты
        </button>

    </div>


    <!-- ФИНАЛ -->

    <div id="finishScreen">

        <div class="finish-card">

            <div class="finish-title">
                Отлично! 🎃
            </div>

            <div class="finish-text">
                Все слоги прочитаны!
            </div>

            <div class="finish-buttons">

                <button
                    class="finish-btn"
                    id="replayBtn">
                    Сыграть ещё раз
                </button>

                <button
                    class="finish-btn"
                    id="newSettingsBtn">
                    Выбрать другие буквы
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   БУКВЫ

   УБРАНЫ:
   Ч, Ш, Щ, Ц, Й, Ж
========================================================= */

const MAX_LETTERS = 8;

const consonantLetters = [
    "М",
    "Н",
    "П",
    "Б",
    "Т",
    "Д",
    "К",
    "Г",
    "Х",
    "Ф",
    "В",
    "С",
    "З",
    "Л",
    "Р"
];

const vowelLetters = [
    "А",
    "О",
    "У",
    "Ы",
    "Э",
    "И",
    "Е",
    "Ё",
    "Ю",
    "Я"
];


/* =========================================================
   ПОЗИЦИИ
========================================================= */

const PUMPKIN_POSITIONS = [

    {
        x: 19,
        y: 57,
        scale: .88
    },

    {
        x: 40,
        y: 49,
        scale: .82
    },

    {
        x: 63,
        y: 50,
        scale: .84
    },

    {
        x: 84,
        y: 58,
        scale: .90
    }

];


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let selectedConsonants = new Set();

let selectedVowels = new Set();

let syllableType = "open";


/*
   Полный список слогов,
   созданный в начале игры.
*/

let allSyllables = [];


/*
   Слоги, которые ещё никогда
   не появлялись на новых тыквах.
*/

let syllableQueue = [];


/*
   Слоги, по которым уже выстрелили.

   Именно они считаются
   прочитанными.
*/

let completedSyllables = new Set();


let gameLocked = false;

let candySlotIndex = null;

let gunAngle = 0;


/* =========================================================
   DOM
========================================================= */

const setupScreen =
    document.getElementById("setupScreen");

const playScreen =
    document.getElementById("playScreen");

const consonantsBox =
    document.getElementById("consonants");

const vowelsBox =
    document.getElementById("vowels");

const selectedCount =
    document.getElementById("selectedCount");

const errorBox =
    document.getElementById("error");

const startBtn =
    document.getElementById("startBtn");

const settingsBtn =
    document.getElementById("settingsBtn");

const pumpkinField =
    document.getElementById("pumpkinField");

const gunWrap =
    document.getElementById("gunWrap");

const crosshair =
    document.getElementById("crosshair");

const laser =
    document.getElementById("laser");

const flyingCandy =
    document.getElementById("flyingCandy");

const collectBtn =
    document.getElementById("collectBtn");

const finishScreen =
    document.getElementById("finishScreen");

const replayBtn =
    document.getElementById("replayBtn");

const newSettingsBtn =
    document.getElementById("newSettingsBtn");


/* =========================================================
   СОЗДАЁМ КНОПКИ БУКВ
========================================================= */

function createLetterButtons(
    letters,
    container,
    group
) {

    container.innerHTML = "";

    letters.forEach(letter => {

        const button =
            document.createElement("button");

        button.className =
            "letter-btn";

        button.textContent =
            letter;

        button.dataset.letter =
            letter;

        button.dataset.group =
            group;

        button.addEventListener(
            "click",
            () => toggleLetter(button)
        );

        container.appendChild(button);

    });

}


createLetterButtons(
    consonantLetters,
    consonantsBox,
    "consonant"
);

createLetterButtons(
    vowelLetters,
    vowelsBox,
    "vowel"
);


/* =========================================================
   ВЫБОР БУКВ
========================================================= */

function toggleLetter(button) {

    errorBox.textContent = "";

    const letter =
        button.dataset.letter;

    const set =
        button.dataset.group === "consonant"
        ? selectedConsonants
        : selectedVowels;


    if (set.has(letter)) {

        set.delete(letter);

        button.classList.remove(
            "selected"
        );

    } else {

        const total =
            selectedConsonants.size +
            selectedVowels.size;

        if (total >= MAX_LETTERS) {

            errorBox.textContent =
                "Можно выбрать максимум 8 букв.";

            return;
        }

        set.add(letter);

        button.classList.add(
            "selected"
        );
    }

    updateCounter();

}


function updateCounter() {

    const total =
        selectedConsonants.size +
        selectedVowels.size;

    selectedCount.textContent =
        ` ${total} / 8`;
}


/* =========================================================
   ТИП СЛОГОВ
========================================================= */

document
.querySelectorAll(".type-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".type-btn")
            .forEach(btn => {

                btn.classList.remove(
                    "selected"
                );

            });

            button.classList.add(
                "selected"
            );

            syllableType =
                button.dataset.type;

        }
    );

});


/* =========================================================
   СОЗДАНИЕ ВСЕХ УНИКАЛЬНЫХ СЛОГОВ
========================================================= */

function buildSyllables() {

    const result = [];

    const consonants =
        [...selectedConsonants];

    const vowels =
        [...selectedVowels];


    consonants.forEach(c => {

        vowels.forEach(v => {

            if (
                syllableType === "open" ||
                syllableType === "mixed"
            ) {

                result.push(
                    c + v
                );
            }


            if (
                syllableType === "closed" ||
                syllableType === "mixed"
            ) {

                result.push(
                    v + c
                );
            }

        });

    });


    /*
       На всякий случай удаляем
       любые возможные дубли.
    */

    return [
        ...new Set(result)
    ];

}


/* =========================================================
   ПОЛУЧИТЬ НОВЫЙ СЛОГ

   ВАЖНО:
   каждый слог выдаётся только один раз.
========================================================= */

function takeNextSyllable() {

    if (
        syllableQueue.length === 0
    ) {

        return null;
    }

    return syllableQueue.shift();

}


/* =========================================================
   СТАРТ
========================================================= */

startBtn.addEventListener(
    "click",
    startGame
);


function startGame() {

    errorBox.textContent = "";


    if (
        selectedConsonants.size === 0
    ) {

        errorBox.textContent =
            "Выбери хотя бы одну согласную.";

        return;
    }


    if (
        selectedVowels.size === 0
    ) {

        errorBox.textContent =
            "Выбери хотя бы одну гласную.";

        return;
    }


    startNewGame();

}


/* =========================================================
   НОВАЯ ИГРА
========================================================= */

function startNewGame() {

    /*
       Создаём полный набор.
    */

    allSyllables =
        buildSyllables();


    /*
       Перемешиваем его один раз.

       Дальше слоги берутся
       последовательно из очереди
       и никогда не возвращаются.
    */

    syllableQueue =
        shuffle(
            [...allSyllables]
        );


    completedSyllables =
        new Set();


    gameLocked = false;

    candySlotIndex = null;


    finishScreen.classList.remove(
        "show"
    );


    setupScreen.style.display =
        "none";


    playScreen.classList.add(
        "active",
        "aiming"
    );


    playScreen.classList.remove(
        "reward-mode"
    );


    createInitialField();

}


/* =========================================================
   ПЕРВЫЕ ТЫКВЫ
========================================================= */

function createInitialField() {

    pumpkinField.innerHTML = "";

    hideReward();


    /*
       Заполняем максимум 4 позиции.

       Если слогов всего 2,
       будет только 2 тыквы.
    */

    for (
        let index = 0;
        index < 4;
        index++
    ) {

        const syllable =
            takeNextSyllable();


        if (!syllable) {
            break;
        }


        createPumpkinAtSlot(
            index,
            syllable
        );

    }


    chooseCandySlot();

}


/* =========================================================
   СОЗДАТЬ ТЫКВУ
========================================================= */

function createPumpkinAtSlot(
    slotIndex,
    syllable
) {

    if (!syllable) {
        return;
    }


    const old =
        pumpkinField.querySelector(
            `[data-slot="${slotIndex}"]`
        );


    if (old) {
        old.remove();
    }


    const position =
        PUMPKIN_POSITIONS[
            slotIndex
        ];


    const slot =
        document.createElement("div");


    slot.className =
        "pumpkin-slot";


    slot.dataset.slot =
        String(slotIndex);


    slot.dataset.hasCandy =
        "0";


    slot.dataset.opened =
        "0";


    /*
       Сохраняем слог прямо
       в самой тыкве.
    */

    slot.dataset.syllable =
        syllable;


    slot.style.left =
        position.x + "%";


    slot.style.top =
        position.y + "%";


    slot.style.setProperty(
        "--pumpkin-scale",
        position.scale
    );


    /* КОНФЕТЫ */

    const candy =
        document.createElement("img");

    candy.src =
        "konfet.png";

    candy.className =
        "candy-inside";

    candy.draggable =
        false;


    /* ЛЕВАЯ ПОЛОВИНА */

    const left =
        document.createElement("img");

    left.src =
        "pumpkin_left.png";

    left.className =
        "half left-half";

    left.draggable =
        false;


    /* ПРАВАЯ ПОЛОВИНА */

    const right =
        document.createElement("img");

    right.src =
        "pumpkin_right.png";

    right.className =
        "half right-half";

    right.draggable =
        false;


    /* ЦЕЛАЯ ТЫКВА */

    const whole =
        document.createElement("img");

    whole.src =
        "tikva.png";

    whole.className =
        "whole-pumpkin";

    whole.draggable =
        false;


    /* СЛОГ */

    const text =
        document.createElement("div");

    text.className =
        "syllable";

    text.textContent =
        syllable;


    slot.appendChild(candy);
    slot.appendChild(left);
    slot.appendChild(right);
    slot.appendChild(whole);
    slot.appendChild(text);


    slot.addEventListener(
        "pointerenter",
        () => {

            if (
                gameLocked ||
                slot.dataset.opened === "1"
            ) {
                return;
            }

            slot.classList.add(
                "targeted"
            );

            crosshair.classList.add(
                "on-target"
            );

        }
    );


    slot.addEventListener(
        "pointerleave",
        () => {

            slot.classList.remove(
                "targeted"
            );

            crosshair.classList.remove(
                "on-target"
            );

        }
    );


    slot.addEventListener(
        "pointerdown",
        event => {

            if (
                gameLocked ||
                slot.dataset.opened === "1"
            ) {
                return;
            }

            event.preventDefault();
            event.stopPropagation();


            shootPumpkin(
                slot,
                event.clientX,
                event.clientY
            );

        }
    );


    pumpkinField.appendChild(
        slot
    );

}


/* =========================================================
   ВЫБРАТЬ ТЫКВУ С КОНФЕТАМИ
========================================================= */

function chooseCandySlot() {

    /*
       Конфеты можно положить
       только в ЦЕЛУЮ активную тыкву.
    */

    const availableSlots =
        [
            ...pumpkinField
            .querySelectorAll(
                ".pumpkin-slot"
            )
        ]
        .filter(
            slot =>
                slot.dataset.opened === "0"
        );


    /*
       Сначала очищаем старые отметки.
    */

    pumpkinField
    .querySelectorAll(
        ".pumpkin-slot"
    )
    .forEach(slot => {

        slot.dataset.hasCandy =
            "0";

        slot.classList.remove(
            "has-candy",
            "candy-flying"
        );

    });


    if (
        availableSlots.length === 0
    ) {

        candySlotIndex = null;

        return;
    }


    const chosen =
        availableSlots[
            Math.floor(
                Math.random() *
                availableSlots.length
            )
        ];


    candySlotIndex =
        Number(
            chosen.dataset.slot
        );


    chosen.dataset.hasCandy =
        "1";

}


/* =========================================================
   ВЫСТРЕЛ
========================================================= */

function shootPumpkin(
    slot,
    hitX,
    hitY
) {

    if (gameLocked) {
        return;
    }


    if (
        slot.dataset.opened === "1"
    ) {
        return;
    }


    /*
       СЛОГ СЧИТАЕТСЯ ПРОЙДЕННЫМ
       ИМЕННО СЕЙЧАС.

       После этого он больше никогда
       не сможет появиться в игре.
    */

    const syllable =
        slot.dataset.syllable;


    completedSyllables.add(
        syllable
    );


    slot.dataset.opened =
        "1";


    slot.classList.remove(
        "targeted"
    );


    crosshair.classList.remove(
        "on-target"
    );


    fireLaser(
        hitX,
        hitY
    );


    createFlash(
        hitX,
        hitY
    );


    gunWrap.classList.remove(
        "recoil"
    );


    void gunWrap.offsetWidth;


    gunWrap.classList.add(
        "recoil"
    );


    const foundCandy =
        slot.dataset.hasCandy === "1";


    if (foundCandy) {

        slot.classList.add(
            "has-candy"
        );

    }


    requestAnimationFrame(
        () => {

            slot.classList.add(
                "opened"
            );

        }
    );


    /*
       ЕСЛИ ЭТО БЫЛ ПОСЛЕДНИЙ СЛОГ
       И КОНФЕТ ЗДЕСЬ НЕТ,
       можем закончить игру
       после анимации тыквы.
    */

    if (!foundCandy) {

        if (allSyllablesRead()) {

            gameLocked = true;

            setTimeout(
                finishGame,
                900
            );

        }

        return;
    }


    /*
       НАШЛИ КОНФЕТЫ.
    */

    gameLocked = true;


    setTimeout(
        () => {

            flyCandyFrom(
                slot
            );

        },
        520
    );

}


/* =========================================================
   ВСЕ ЛИ СЛОГИ ПРОЧИТАНЫ?
========================================================= */

function allSyllablesRead() {

    return (
        completedSyllables.size >=
        allSyllables.length
    );

}


/* =========================================================
   ПОЛЁТ КОНФЕТ
========================================================= */

function flyCandyFrom(slot) {

    const insideCandy =
        slot.querySelector(
            ".candy-inside"
        );


    const rect =
        insideCandy
        .getBoundingClientRect();


    const startX =
        rect.left +
        rect.width / 2;


    const startY =
        rect.top +
        rect.height / 2;


    const startWidth =
        Math.max(
            rect.width,
            45
        );


    flyingCandy.style.transition =
        "none";


    flyingCandy.style.left =
        startX + "px";


    flyingCandy.style.top =
        startY + "px";


    flyingCandy.style.width =
        startWidth + "px";


    flyingCandy.style.opacity =
        "1";


    flyingCandy.style.transform =
        "translate(-50%,-50%)";


    void flyingCandy.offsetWidth;


    /*
       Теперь картинка внутри исчезает,
       а летящая находится точно
       на её месте.
    */

    slot.classList.add(
        "candy-flying"
    );


    requestAnimationFrame(
        () => {

            flyingCandy.style.transition =
                [
                    "left 1.45s cubic-bezier(.22,.72,.24,1)",
                    "top 1.45s cubic-bezier(.22,.72,.24,1)",
                    "width 1.45s cubic-bezier(.22,.72,.24,1)"
                ].join(",");


            flyingCandy.style.left =
                "50%";


            flyingCandy.style.top =
                "42%";


            flyingCandy.style.width =
                "clamp(230px,24vw,380px)";

        }
    );


    playScreen.classList.remove(
        "aiming"
    );


    playScreen.classList.add(
        "reward-mode"
    );


    setTimeout(
        () => {

            collectBtn.classList.add(
                "show"
            );

        },
        1500
    );

}


/* =========================================================
   ЗАБРАТЬ КОНФЕТЫ
========================================================= */

collectBtn.addEventListener(
    "click",
    event => {

        event.preventDefault();
        event.stopPropagation();


        collectBtn.classList.remove(
            "show"
        );


        flyingCandy.style.transition =
            "opacity .28s ease, transform .28s ease";


        flyingCandy.style.opacity =
            "0";


        flyingCandy.style.transform =
            "translate(-50%,-50%) scale(.75)";


        setTimeout(
            () => {

                /*
                   Если это уже был
                   последний слог,
                   ничего нового
                   создавать не надо.
                */

                if (allSyllablesRead()) {

                    hideReward();

                    finishGame();

                    return;
                }


                /*
                   Ищем разбитые позиции.
                */

                const brokenSlots = [];


                for (
                    let index = 0;
                    index < 4;
                    index++
                ) {

                    const pumpkin =
                        pumpkinField
                        .querySelector(
                            `[data-slot="${index}"]`
                        );


                    if (
                        pumpkin &&
                        pumpkin.dataset.opened === "1"
                    ) {

                        brokenSlots.push(
                            index
                        );

                    }

                }


                /*
                   Удаляем разбитые.
                */

                brokenSlots.forEach(
                    index => {

                        const pumpkin =
                            pumpkinField
                            .querySelector(
                                `[data-slot="${index}"]`
                            );


                        if (pumpkin) {
                            pumpkin.remove();
                        }

                    }
                );


                /*
                   Теперь заполняем освободившиеся
                   позиции ТОЛЬКО новыми слогами.

                   Если очередь закончилась,
                   позиция остаётся пустой.

                   НИКАКИХ ПОВТОРОВ.
                */

                brokenSlots.forEach(
                    index => {

                        const nextSyllable =
                            takeNextSyllable();


                        if (
                            nextSyllable
                        ) {

                            createPumpkinAtSlot(
                                index,
                                nextSyllable
                            );

                        }

                    }
                );


                hideReward();


                gameLocked = false;


                playScreen.classList.remove(
                    "reward-mode"
                );


                playScreen.classList.add(
                    "aiming"
                );


                /*
                   Конфеты снова прячутся
                   среди оставшихся
                   целых тыкв.
                */

                chooseCandySlot();


                /*
                   Теоретическая защита:
                   если активных слогов уже нет,
                   заканчиваем игру.
                */

                if (
                    allSyllablesRead()
                ) {

                    finishGame();

                }

            },
            300
        );

    }
);


/* =========================================================
   ФИНАЛ ИГРЫ
========================================================= */

function finishGame() {

    gameLocked = true;


    playScreen.classList.remove(
        "aiming",
        "reward-mode"
    );


    crosshair.classList.remove(
        "on-target"
    );


    hideReward();


    /*
       Небольшая задержка делает
       завершение мягче.
    */

    setTimeout(
        () => {

            finishScreen.classList.add(
                "show"
            );

        },
        250
    );

}


/* =========================================================
   СЫГРАТЬ ЕЩЁ РАЗ

   Буквы и тип остаются теми же,
   но порядок слогов новый.
========================================================= */

replayBtn.addEventListener(
    "click",
    () => {

        finishScreen.classList.remove(
            "show"
        );

        startNewGame();

    }
);


/* =========================================================
   ВЫБРАТЬ ДРУГИЕ БУКВЫ
========================================================= */

newSettingsBtn.addEventListener(
    "click",
    () => {

        finishScreen.classList.remove(
            "show"
        );


        playScreen.classList.remove(
            "active",
            "aiming",
            "reward-mode"
        );


        pumpkinField.innerHTML =
            "";


        hideReward();


        gameLocked = false;


        setupScreen.style.display =
            "flex";

    }
);


/* =========================================================
   СКРЫТЬ НАГРАДУ
========================================================= */

function hideReward() {

    collectBtn.classList.remove(
        "show"
    );


    flyingCandy.style.transition =
        "none";


    flyingCandy.style.opacity =
        "0";


    flyingCandy.style.width =
        "1px";


    flyingCandy.style.transform =
        "translate(-50%,-50%)";

}


/* =========================================================
   ДВИЖЕНИЕ ПРИЦЕЛА
========================================================= */

playScreen.addEventListener(
    "pointermove",
    event => {

        if (gameLocked) {
            return;
        }


        crosshair.style.left =
            event.clientX + "px";


        crosshair.style.top =
            event.clientY + "px";


        aimGunAt(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   ПОВОРОТ ПИСТОЛЕТА
========================================================= */

function aimGunAt(
    targetX,
    targetY
) {

    const height =
        gunWrap.offsetHeight;


    const pivotX =
        window.innerWidth / 2;


    const pivotY =
        window.innerHeight +
        window.innerHeight * .03 -
        height * .08;


    const dx =
        targetX -
        pivotX;


    const dy =
        pivotY -
        targetY;


    let angle =
        Math.atan2(
            dx,
            Math.max(
                dy,
                80
            )
        )
        *
        180 /
        Math.PI;


    angle =
        Math.max(
            -34,
            Math.min(
                34,
                angle
            )
        );


    gunAngle =
        angle;


    gunWrap.style.transform =
        `translateX(-50%) rotate(${angle}deg)`;

}


/* =========================================================
   ТОЧКА ДУЛА
========================================================= */

function getMuzzlePoint() {

    const height =
        gunWrap.offsetHeight;


    const pivotX =
        window.innerWidth / 2;


    const pivotY =
        window.innerHeight +
        window.innerHeight * .03 -
        height * .08;


    const muzzleDistance =
        height * .82;


    const radians =
        gunAngle *
        Math.PI /
        180;


    return {

        x:
            pivotX +
            Math.sin(radians) *
            muzzleDistance,

        y:
            pivotY -
            Math.cos(radians) *
            muzzleDistance

    };

}


/* =========================================================
   ЛАЗЕР
========================================================= */

function fireLaser(
    targetX,
    targetY
) {

    const muzzle =
        getMuzzlePoint();


    const dx =
        targetX -
        muzzle.x;


    const dy =
        targetY -
        muzzle.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const angle =
        Math.atan2(
            dy,
            dx
        )
        *
        180 /
        Math.PI;


    laser.style.left =
        muzzle.x + "px";


    laser.style.top =
        muzzle.y + "px";


    laser.style.width =
        distance + "px";


    laser.style.transform =
        `rotate(${angle}deg)`;


    laser.classList.remove(
        "fire"
    );


    void laser.offsetWidth;


    laser.classList.add(
        "fire"
    );

}


/* =========================================================
   ВСПЫШКА
========================================================= */

function createFlash(
    x,
    y
) {

    const flash =
        document.createElement(
            "div"
        );


    flash.className =
        "hit-flash";


    flash.style.left =
        x + "px";


    flash.style.top =
        y + "px";


    playScreen.appendChild(
        flash
    );


    setTimeout(
        () => {

            flash.remove();

        },
        350
    );

}


/* =========================================================
   НАСТРОЙКИ
========================================================= */

settingsBtn.addEventListener(
    "click",
    () => {

        playScreen.classList.remove(
            "active",
            "aiming",
            "reward-mode"
        );


        finishScreen.classList.remove(
            "show"
        );


        setupScreen.style.display =
            "flex";


        pumpkinField.innerHTML =
            "";


        hideReward();


        gameLocked =
            false;

    }
);


/* =========================================================
   ПЕРЕМЕШИВАНИЕ
========================================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ]
        =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}
